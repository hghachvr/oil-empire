<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Oil Empire"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Oil Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;letter-spacing:0}
html,body{height:100%;background:#0a0a0a;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{-webkit-appearance:none;font-family:'Press Start 2P',monospace;cursor:pointer;touch-action:manipulation;letter-spacing:0}
#app{font-family:'Press Start 2P',monospace;background:#0a0a0a;height:100dvh;max-width:390px;margin:0 auto;color:#e8e0d0;display:flex;flex-direction:column;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none}

#header{background:linear-gradient(180deg,#1a0a00,#08080a);border-bottom:3px solid #f5a623;padding:max(env(safe-area-inset-top,0px),8px) 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#title{font-size:11px;color:#f5a623;text-shadow:0 0 14px #f5a62390;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin-right:8px}
#hbtns{display:flex;gap:4px;flex-shrink:0}
.hbtn{background:none;border:2px solid #1e2832;color:#8a7f70;padding:6px 8px;font-size:8px;border-radius:3px;font-weight:bold;white-space:nowrap}
#rebirth-btn.unlocked{border-color:#ffd700!important;color:#ffd700!important;animation:rglow 1.5s ease infinite}

#stats{background:#0f1318;border-bottom:1px solid #1e2832;padding:6px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex-shrink:0;text-align:center}
.stat-label{font-size:6px;color:#8a7f70;display:block;margin-bottom:1px}
.stat-val{font-size:11px;color:#e8e0d0;display:block;font-weight:bold}
.stat-val.gold{color:#f5a623}
.stat-sub{font-size:6px;color:#8a7f70;display:block;margin-top:1px}
.stat-sub.green{color:#4caf50}

/* EVENT BANNER */
#event-banner{display:none;background:linear-gradient(90deg,#1a0a00,#2a1400,#1a0a00);border-top:1px solid #f5a623;border-bottom:1px solid #f5a623;padding:5px 12px;flex-shrink:0;text-align:center;animation:eventPulse 2s ease infinite}
#event-text{font-size:6px;color:#f5a623;font-weight:bold}
#event-timer{font-size:6px;color:#c47d10;margin-top:2px}
@keyframes eventPulse{0%,100%{background:linear-gradient(90deg,#1a0a00,#2a1400,#1a0a00)}50%{background:linear-gradient(90deg,#2a1400,#3a2000,#2a1400)}}

#drill-area{position:relative;height:200px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#drill-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 75%,#0d2000,transparent 55%),radial-gradient(ellipse at 75% 20%,#1a1000,transparent 55%),#090909}
#grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(245,166,35,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,.025) 1px,transparent 1px);background-size:16px 16px}
#oil-fill{position:absolute;bottom:0;left:0;right:0;height:0%;transition:height .6s ease;background:linear-gradient(0deg,#0c2200,#1a4a0070)}
#scene-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.pipe-h{position:absolute;height:6px;background:linear-gradient(180deg,#5a4200,#3a2800);border-radius:3px;border:1px solid #6a5200}
.pipe-v{position:absolute;width:6px;background:linear-gradient(90deg,#5a4200,#3a2800);border-radius:3px;border:1px solid #6a5200}
.pipe-glow{box-shadow:0 0 4px #f5a62340}
.barrel-scene{position:absolute;width:18px;height:22px;border-radius:2px}
.smoke-puff{position:absolute;border-radius:50%;pointer-events:none;animation:smokeFade 2.5s ease-out forwards}
.oil-bubble{position:absolute;border-radius:50%;background:radial-gradient(circle,#2d6a00,#0a2200);border:1px solid #3a8000;animation:bubbleFloat linear infinite}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f5a623;animation:sparkFly 0.8s ease-out forwards}
.dollar-float{position:absolute;font-size:10px;animation:dollarRise 1.5s ease-out forwards;pointer-events:none;z-index:5}
#combo-text{position:absolute;top:10px;left:12px;font-size:10px;color:#ff6b35;text-shadow:0 0 10px #ff6b35;display:none;z-index:4;font-weight:bold}
#bps-text{position:absolute;top:10px;right:12px;font-size:7px;color:#8a7f70;z-index:4;font-weight:bold}
#rebirth-progress-bar{position:absolute;bottom:8px;left:14px;right:14px;z-index:4;display:none}
#rp-label{font-size:6px;color:#8a7f70;margin-bottom:2px;font-weight:bold}
#rebirth-ready-text{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:8px;color:#ffd700;animation:rglow 1s ease infinite;display:none;z-index:4;font-weight:bold}
#drill-btn{position:relative;z-index:3;width:150px;height:150px;border-radius:50%;border:4px solid #f5a623;background:radial-gradient(circle at 38% 32%,#3e2c00,#150f00);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:opulse 2.2s ease infinite;outline:none;flex-shrink:0;padding:0 10px}
#drill-label{font-size:5px;color:#c47d10;margin-top:3px;text-align:center;line-height:1.6;max-width:100px;white-space:normal}
#drill-svg{transition:transform .09s,filter .09s;width:72px;height:72px;flex-shrink:0}
#particles{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.particle{position:absolute;font-size:8px;color:#f5a623;font-family:'Press Start 2P',monospace;pointer-events:none;font-weight:bold;white-space:nowrap}
#flash-msg{position:absolute;top:38%;left:50%;transform:translateX(-50%) translateY(-50%);background:rgba(0,0,0,.9);border:1px solid #f5a623;padding:6px 12px;font-size:7px;color:#f5a623;border-radius:3px;pointer-events:none;z-index:50;white-space:nowrap;display:none;animation:flashIn 1.8s ease forwards}

#sell-row{padding:5px 10px;display:flex;gap:7px;flex-shrink:0}
#sell-btn{flex:1;padding:9px 4px;background:linear-gradient(180deg,#4caf50,#2e7d32);border:2px solid #81c784;color:#fff;font-size:7px;border-radius:3px;box-shadow:0 3px 0 #1b5e20;line-height:1.5;font-weight:bold}
#sell-btn:active{transform:translateY(2px);box-shadow:none}
#boost-btn{padding:9px 9px;background:linear-gradient(180deg,#0d47a1,#060d2e);border:2px solid #1565c0;color:#fff;font-size:6px;border-radius:3px;text-align:center;line-height:1.7;box-shadow:0 3px 0 #001040;min-width:68px;font-weight:bold}
#boost-btn.active{background:linear-gradient(180deg,#4a148c,#1a0050);border-color:#ce93d8;box-shadow:0 3px 0 #12003d}

#tab-bar{display:flex;border-bottom:2px solid #1e2832;background:#0f1318;flex-shrink:0}
.tab-btn{flex:1;padding:7px 2px;background:none;border:none;border-bottom:2px solid transparent;color:#8a7f70;font-size:6px;font-weight:bold}
.tab-btn.active{background:#1e2832;border-bottom-color:#f5a623;color:#f5a623}

#tab-content{flex:1;overflow-y:auto;padding:7px 8px 10px;-webkit-overflow-scrolling:touch;min-height:0}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

.upg-card{background:#0f1318;border:1px solid #141414;border-radius:4px;padding:8px 9px;margin-bottom:5px;display:flex;align-items:center;gap:8px;transition:border-color .2s}
.upg-card.afford{border-color:#2a2a2a}
.upg-card.maxed{border-color:#1a3a00}
.upg-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.upg-info{flex:1;min-width:0}
.upg-row{display:flex;justify-content:space-between;margin-bottom:2px}
.upg-name{font-size:6px;color:#e8e0d0;font-weight:bold}
.upg-name.maxed{color:#4caf50}
.upg-lvl{font-size:6px;color:#8a7f70}
.upg-lvl.maxed{color:#4caf50}
.prog-bar-bg{background:#0a0a0a;border-radius:2px;height:6px;overflow:hidden;border:1px solid #222}
.prog-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.upg-stat{font-size:5px;color:#8a7f70;margin-top:2px}
.upg-buy-btn{padding:7px 5px;min-width:52px;border:1px solid #222;background:linear-gradient(180deg,#1e1e1e,#0f0f0f);color:#3a3a3a;font-size:6px;border-radius:2px;flex-shrink:0;text-align:center;line-height:1.8}
.upg-buy-btn.afford{background:linear-gradient(180deg,#f5a623,#c47d10);border-color:#c47d10;color:#000;box-shadow:0 2px 0 #c47d10}
.upg-buy-btn.maxed{background:linear-gradient(180deg,#1a3a00,#0f2000);border-color:#2a5a00;color:#4caf50}

/* ACHIEVEMENTS TAB */
.ach-card{background:#0f1318;border:1px solid #1e2832;border-radius:4px;padding:8px 10px;margin-bottom:5px;display:flex;align-items:center;gap:10px;opacity:.45;transition:all .3s}
.ach-card.unlocked{border-color:#b8860b;opacity:1;background:#110e00}
.ach-card.unlocked.new-ach{animation:achPop .6s ease}
.ach-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:6px;color:#e8e0d0;font-weight:bold;margin-bottom:2px}
.ach-name.done{color:#ffd700}
.ach-desc{font-size:5px;color:#8a7f70;line-height:1.6}
.ach-reward{font-size:5px;color:#4caf50;margin-top:2px}
.ach-badge{font-size:14px;flex-shrink:0}
@keyframes achPop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

/* INVESTMENTS TAB */
.inv-card{background:#0f1318;border:1px solid #1e2832;border-radius:4px;padding:9px 10px;margin-bottom:6px;display:flex;align-items:center;gap:9px;transition:border-color .2s}
.inv-card.owned{border-color:#1a3a00;opacity:.75}
.inv-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.inv-info{flex:1;min-width:0}
.inv-name{font-size:6px;color:#e8e0d0;font-weight:bold;margin-bottom:2px}
.inv-desc{font-size:5px;color:#8a7f70}
.inv-buy-btn{padding:7px 5px;min-width:54px;border:1px solid #222;background:linear-gradient(180deg,#1e1e1e,#0f0f0f);color:#3a3a3a;font-size:6px;border-radius:2px;flex-shrink:0;text-align:center;line-height:1.8}
.inv-buy-btn.afford{background:linear-gradient(180deg,#1565c0,#0d47a1);border-color:#42a5f5;color:#fff;box-shadow:0 2px 0 #002171}
.inv-buy-btn.owned{background:linear-gradient(180deg,#1a3a00,#0f2000);border-color:#2a5a00;color:#4caf50}

/* PRESTIGE */
#pp-card{background:#100820;border:1px solid #4a1a7a;border-radius:4px;padding:9px;margin-bottom:7px;text-align:center}
#pp-label{font-size:7px;color:#ce93d8;margin-bottom:3px;font-weight:bold}
#pp-val{font-size:18px;color:#e040fb;font-weight:bold}
#pp-sub{font-size:6px;color:#8a7f70;margin-top:2px}
.rebirth-req-card{background:#0f0c00;border:2px solid #2a2000;border-radius:4px;padding:9px;margin-bottom:7px}
.rebirth-req-card.can-rebirth{background:#1a1200;border-color:#ffd700;animation:rglow 1.5s ease infinite}
.rr-title{font-size:8px;color:#6a5a00;margin-bottom:5px;text-align:center;font-weight:bold}
.rr-title.can{color:#ffd700}
.rr-desc{font-size:6px;color:#8a7f70;line-height:1.9;margin-bottom:7px;text-align:center}
.rr-req-row{font-size:6px;margin-bottom:3px;font-weight:bold}
.rr-req-label{color:#888}
.rr-req-label.done{color:#4caf50}
.req-prog{background:#0a0a0a;border-radius:2px;height:6px;overflow:hidden;border:1px solid #222;margin-bottom:5px}
.req-prog-fill{height:100%;border-radius:2px;transition:width .4s}
.rebirth-action-btn{width:100%;padding:9px;margin-top:7px;background:linear-gradient(180deg,#1a1a1a,#0d0d0d);border:1px solid #333;color:#333;font-size:7px;border-radius:3px;font-weight:bold}
.rebirth-action-btn.can{background:linear-gradient(180deg,#b8860b,#7a5c00);border-color:#ffd700;color:#ffd700;box-shadow:0 3px 0 #5a4000}
.prest-card{background:#0f1318;border:1px solid #141414;border-radius:4px;padding:9px;margin-bottom:6px}
.prest-card.owned{border-color:#4a1a7a;opacity:.72}
.prest-inner{display:flex;align-items:center;gap:8px}
.prest-icon{font-size:16px}
.prest-name{font-size:6px;margin-bottom:2px;font-weight:bold}
.prest-desc{font-size:5px;color:#8a7f70}
.prest-buy-btn{padding:6px 7px;background:linear-gradient(180deg,#1a1a1a,#0d0d0d);border:1px solid #2a2a2a;color:#3a3a3a;font-size:6px;border-radius:2px;flex-shrink:0;font-weight:bold}
.prest-buy-btn.afford{background:linear-gradient(180deg,#6a1fa2,#3a0870);border-color:#ce93d8;color:#fff;box-shadow:0 2px 0 #2a0050}

#modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
#modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.9)}
#modal-box{position:relative;z-index:1;background:#0f1318;border:2px solid #f5a623;border-radius:4px;padding:18px;max-width:340px;width:92%;box-shadow:0 0 35px #f5a62325;max-height:88vh;overflow-y:auto}
.modal-title{font-size:10px;color:#f5a623;margin-bottom:10px;text-align:center}
.modal-title.gold{color:#ffd700;text-shadow:0 0 14px #ffd700}
.modal-title.blue{color:#64b5f6}
.modal-title.green{color:#4caf50}
.modal-desc{font-size:6px;color:#8a7f70;line-height:2;margin-bottom:12px;text-align:center}
.modal-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:6px}
.modal-row-label{color:#8a7f70}
.btn-row{display:flex;gap:8px;justify-content:center}
.btn-primary{padding:9px 16px;background:linear-gradient(180deg,#f5a623,#c47d10);border:2px solid #ffcc70;color:#000;font-size:7px;border-radius:2px;box-shadow:0 3px 0 #c47d10}
.btn-gold{padding:9px 16px;background:linear-gradient(180deg,#b8860b,#7a5c00);border:2px solid #ffd700;color:#ffd700;font-size:7px;border-radius:2px;box-shadow:0 3px 0 #5a4000}
.btn-blue{padding:9px 16px;background:linear-gradient(180deg,#1565c0,#0d47a1);border:2px solid #64b5f6;color:#fff;font-size:7px;border-radius:2px;box-shadow:0 3px 0 #002171}
.btn-sec{padding:9px 14px;background:linear-gradient(180deg,#1e1e1e,#0f0f0f);border:2px solid #333;color:#8a7f70;font-size:7px;border-radius:2px}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.settings-label{font-size:6px;color:#8a7f70}
.lang-btn{padding:5px 10px;background:#1a1a1a;border:1px solid #333;color:#8a7f70;font-size:6px;border-radius:2px}
.lang-btn.active{background:#f5a623;border-color:#c47d10;color:#000}
.small-btn{padding:5px 10px;background:#1a1a1a;border:1px solid #333;color:#8a7f70;font-size:6px;border-radius:2px}
.danger-btn{padding:5px 10px;background:#1a0000;border:1px solid #e53935;color:#e53935;font-size:6px;border-radius:2px}
.offline-barrel{color:#4caf50;font-size:14px}

#tutorial-overlay{position:fixed;inset:0;z-index:200;display:none;pointer-events:none}
#tutorial-overlay.show{display:block}
#tut-bg{position:absolute;inset:0;background:rgba(0,0,0,.91)}
#tut-box{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);z-index:210;background:#0f1318;border:2px solid #f5a623;border-radius:4px;padding:15px;max-width:320px;width:90%;box-shadow:0 0 35px #f5a62340;pointer-events:auto}
#tut-step{font-size:6px;color:#8a7f70;margin-bottom:4px}
#tut-title{font-size:9px;color:#f5a623;margin-bottom:7px;text-shadow:0 0 10px #f5a623;line-height:1.7}
#tut-desc{font-size:6px;color:#8a7f70;line-height:2.1;margin-bottom:12px}
#safe-bottom{height:env(safe-area-inset-bottom,0);background:#0a0a0a;flex-shrink:0}

/* Achievement popup toast */
#ach-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#110e00;border:2px solid #ffd700;border-radius:4px;padding:10px 14px;font-size:7px;color:#ffd700;z-index:300;display:none;text-align:center;box-shadow:0 0 20px #ffd70040;animation:toastIn .4s ease;white-space:nowrap}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

@keyframes opulse{0%,100%{box-shadow:0 0 20px rgba(245,166,35,.4),inset 0 0 20px rgba(0,0,0,.5)}50%{box-shadow:0 0 40px rgba(245,166,35,.8),0 0 70px rgba(245,166,35,.25),inset 0 0 20px rgba(0,0,0,.5)}}
@keyframes rglow{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.5)}50%{box-shadow:0 0 22px rgba(255,215,0,1),0 0 45px rgba(255,215,0,.4)}}
@keyframes flashIn{0%{opacity:0;transform:translateX(-50%) translateY(-60%)}20%{opacity:1;transform:translateX(-50%) translateY(-50%)}80%{opacity:1;transform:translateX(-50%) translateY(-50%)}100%{opacity:0;transform:translateX(-50%) translateY(-40%)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.5)}}
@keyframes smokeFade{0%{opacity:.7;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(2.5) translateY(-30px)}}
@keyframes bubbleFloat{0%{transform:translateY(0) scale(1);opacity:.8}50%{opacity:1}100%{transform:translateY(-40px) scale(1.2);opacity:0}}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}
@keyframes dollarRise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes derrickBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes flameFlicker{0%,100%{transform:scaleY(1) scaleX(1);opacity:1}33%{transform:scaleY(1.3) scaleX(.8);opacity:.8}66%{transform:scaleY(.8) scaleX(1.2);opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="title">IMPERIO PETROLERO</div>
    <div id="hbtns">
      <button class="hbtn" id="boost-hbtn" onclick="openModal('boost')">🚀</button>
      <button class="hbtn" id="rebirth-btn" onclick="openModal('rebirth')">🌟</button>
      <button class="hbtn" onclick="openModal('settings')">⚙️</button>
    </div>
  </div>

  <div id="stats">
    <div>
      <span class="stat-label">🛢️ <span id="lbl-barrels">Barriles</span></span>
      <span class="stat-val" id="stat-barrels">0</span>
      <span class="stat-sub green" id="stat-bps"></span>
    </div>
    <div>
      <span class="stat-label">⚗️ <span id="lbl-proc">Procesados</span></span>
      <span class="stat-val" id="stat-proc">0</span>
      <span class="stat-sub" id="lbl-price">$102/barril</span>
    </div>
    <div>
      <span class="stat-label">💵 <span id="lbl-dollars">Dólares</span></span>
      <span class="stat-val gold" id="stat-dollars">$0</span>
      <span class="stat-sub" id="stat-total">$0 total</span>
    </div>
  </div>

  <!-- EVENT BANNER -->
  <div id="event-banner">
    <div id="event-text"></div>
    <div id="event-timer"></div>
  </div>

  <div id="drill-area">
    <div id="drill-bg"></div>
    <div id="grid-overlay"></div>
    <div id="oil-fill"></div>
    <div id="scene-layer"></div>
    <div id="combo-text">¡COMBO! ×<span id="combo-num">0</span></div>
    <div id="bps-text"></div>
    <div id="rebirth-progress-bar">
      <div id="rp-label"></div>
      <div class="prog-bar-bg"><div id="rp-fill" class="prog-bar-fill" style="background:#ffd700;width:0%"></div></div>
    </div>
    <div id="rebirth-ready-text">⚡ RENACER AHORA ⚡</div>
    <button id="drill-btn" ontouchstart="handleTap(event)" onmousedown="handleTap(event)">
      <svg id="drill-svg" width="72" height="72" viewBox="0 0 18 18" style="image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(245,166,35,.5))">
        <rect x="0" y="15" width="18" height="3" fill="#2a1800"/>

  try{ const ac=getAC();if(!ac)return; const o=ac.createOscillator(),g=ac.createGain();

}

function fmt(n){ if(n>=1e12)return(n/1e12).toFixed(2)+"T";if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.floor(n).toString(); }
function fmtTime(ms){ const s=Math.ceil(ms/1000),m=Math.floor(s/60),ss=s%60;return m+":"+(ss<10?"0":"")+ss; }
function upgradeCost(u){
  // Base cost scales up by 30% per rebirth so grinding stays meaningful
  const rebirthScale=Math.pow(1.30,G.rebirths);
  return Math.floor(u.base*rebirthScale*Math.pow(u.mult,G.upgrades[u.id]||0));
}

function investmentCost(inv){
  // Investment costs scale by 40% per rebirth above minRebirth
  const extraRebirths=Math.max(0,G.rebirths-inv.minRebirth+1);
  return Math.floor(inv.baseCost*Math.pow(1.40,extraRebirths));
}

    if(r.sellBonus)sellMult += r.sellBonus;

    if(r.ppBonus)  ppBonus  += r.ppBonus;
  });
  return {tapMult,bpsMult,sellMult,ppBonus};
}

function getInvestmentBonus(){
  let sellMult=1,tapMult=1,bpsMult=1;
  const owned=G.investments||[];
  owned.forEach(id=>{
    const inv=INVESTMENTS.find(x=>x.id===id);if(!inv)return;
    const b=inv.bonus;
    if(b.sellMult)  sellMult += b.sellMult;
    if(b.sellMult2x)sellMult *= 1.5;
    if(b.tapMult)   tapMult  += b.tapMult;
    if(b.bpsMult)   bpsMult  += b.bpsMult;
    if(b.allMult){  tapMult+=b.allMult;bpsMult+=b.allMult;sellMult+=b.allMult; }
  });
  return {sellMult,tapMult,bpsMult};
}

function getEventBonus(){
  const now=Date.now();
  if(!G.activeEvent||now>G.eventEnd) return {sellMult:1,bpsMult:1};
  const ev=EVENTS_CONFIG.find(e=>e.id===G.activeEvent);
  if(!ev) return {sellMult:1,bpsMult:1};
  return {
    sellMult:ev.effect.sellMult||1,
    bpsMult:ev.effect.bpsMult||1,
  };
}

function totalBPS(){
  let bps=0;
  UPGRADES.forEach(u=>{bps+=u.bps*(G.upgrades[u.id]||0);});
  const boost=G.boostActive&&Date.now()<G.boostEnd?3:1;
  const prest=G.prestigeBought.includes("oil_rush")?2.0:1;
  const pty=G.prestigeBought.includes("tycoon")?2.0:1;
  const ab=getAchievementBonus();
  const ib=getInvestmentBonus();
  const eb=getEventBonus();
  return bps*G.rebirthMult*boost*prest*pty*ab.bpsMult*ib.bpsMult*eb.bpsMult;
}

function tapPower(){
  let tp=1;
  UPGRADES.forEach(u=>{if(u.tap)tp+=u.tap*(G.upgrades[u.id]||0);});
  const boost=G.boostActive&&Date.now()<G.boostEnd?3:1;
  const combo=1+Math.min(comboCount*0.08,1.5);
  const pg=G.prestigeBought.includes("golden")?1.50:1;
  const pd=G.prestigeBought.includes("deep")?1.5:1;
  const pty=G.prestigeBought.includes("tycoon")?2.0:1;
  const ab=getAchievementBonus();
  const ib=getInvestmentBonus();
  return tp*G.rebirthMult*boost*combo*pg*pd*pty*ab.tapMult*ib.tapMult;
}

function sellPrice(){
  const ab=getAchievementBonus();
  const ib=getInvestmentBonus();
  return BASE_SELL*(G.prestigeBought.includes("black")?1.35:1)*ab.sellMult*ib.sellMult;
}

function allMaxed(){return UPGRADES.every(u=>(G.upgrades[u.id]||0)>=u.max);}
function canRebirth(){return allMaxed()&&G.dollars>=REBIRTH_MONEY;}
function rebirthItemsPct(){return UPGRADES.filter(u=>(G.upgrades[u.id]||0)>=u.max).length/UPGRADES.length;}
function rebirthMoneyPct(){return Math.min(1,G.dollars/REBIRTH_MONEY);}

// ══════════════════════ SAVE / LOAD ══════════════════════
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({...G,savedAt:Date.now()}));}catch(e){}}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){applyNewGameBonus();showTutorial();return;}
    const s=JSON.parse(raw);
    Object.assign(G,s);
    UPGRADES.forEach(u=>{if(!(u.id in G.upgrades))G.upgrades[u.id]=0;});
    if(!G.prestigeBought)G.prestigeBought=[];
    if(!G.seenMilestones)G.seenMilestones=[];
    if(!G.achievements)G.achievements=[];
    if(!G.investments)G.investments=[];
    G.totalTaps=G.totalTaps||0; G.maxCombo=G.maxCombo||0; G.eventsUsed=G.eventsUsed||0;
    if(s.savedAt){
      const offSec=(Date.now()-s.savedAt)/1000;
      if(offSec>30){
        let bpsV=0;UPGRADES.forEach(u=>{bpsV+=u.bps*(s.upgrades?.[u.id]||0);});
        const ob=Math.floor(bpsV*offSec*(s.rebirthMult||1)*0.5);
        if(ob>0){openOfflineModal(Date.now()-s.savedAt,ob);return;}
      }
    }
    if(!G.tutDone)showTutorial();
  }catch(e){applyNewGameBonus();showTutorial();}
}

// ══════════════════════ EVENTS ══════════════════════
let eventCheckInterval=null;
function startEventSystem(){
  // Check every 3-7 minutes for a new event
  scheduleNextEvent();
}

function scheduleNextEvent(){
  const delay=(180+Math.random()*240)*1000; // 3-7 min
  setTimeout(triggerRandomEvent,delay);
}

function triggerRandomEvent(){
  if(G.activeEvent&&Date.now()<G.eventEnd){scheduleNextEvent();return;}
  // Pick a random event (weighted: avoid storm too often)
  const pool=EVENTS_CONFIG.filter(e=>e.id!=="storm"||Math.random()<0.25);
  const ev=pool[Math.floor(Math.random()*pool.length)];

  G.activeEvent=ev.id;
  G.eventEnd=ev.dur>0?Date.now()+ev.dur*1000:Date.now()+1000;

  // Apply instant effects
  if(ev.effect.barrelBonus){G.barrels+=ev.effect.barrelBonus;flash("💦 +"+fmt(ev.effect.barrelBonus)+" barriles!","#64b5f6");}
  if(ev.effect.nextSaleMult){G.eventNextSaleMult=ev.effect.nextSaleMult;}

  sfxEvent();
  const name=G.lang==="en"?ev.en:ev.es;
  const desc=G.lang==="en"?ev.en_d:ev.es_d;
  showEventBanner(name,desc,ev.dur);
  G.eventsUsed=(G.eventsUsed||0)+1;
  checkAchievements();
  scheduleNextEvent();
}

function showEventBanner(name,desc,dur){
  const banner=document.getElementById("event-banner");
  document.getElementById("event-text").textContent="⚡ "+name+" — "+desc;
  banner.style.display="block";
  if(dur>0){
    const tick=setInterval(()=>{
      const rem=G.eventEnd-Date.now();
      if(rem<=0){banner.style.display="none";clearInterval(tick);}
      else document.getElementById("event-timer").textContent=fmtTime(rem);
    },500);
  } else {
    setTimeout(()=>{banner.style.display="none";},3000);
  }
}

// ══════════════════════ ACTIONS ══════════════════════
function handleTap(e){
  e.preventDefault();sfxDrill();
  const power=tapPower();
  G.barrels+=power;G.processed+=power*0.8;oilLevel=Math.min(100,oilLevel+power*0.15);
  G.totalTaps=(G.totalTaps||0)+1;
  comboCount++;if(G.maxCombo===undefined||comboCount>G.maxCombo)G.maxCombo=comboCount;
  if(comboTimer)clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{comboCount=0;updateCombo();},1500);
  updateCombo();if(comboCount>5)sfxCombo(comboCount);
  const btn=document.getElementById("drill-btn"),svg=document.getElementById("drill-svg");
  btn.style.animation="none";btn.style.transform="scale(0.91)";svg.style.transform="translateY(3px) scale(.96)";svg.style.filter="drop-shadow(0 0 12px rgba(245,166,35,.9))";
  setTimeout(()=>{btn.style.transform="";svg.style.transform="";svg.style.filter="drop-shadow(0 0 8px rgba(245,166,35,.5))";btn.style.animation="opulse 2.2s ease infinite";},130);
  const rect=btn.getBoundingClientRect();
  const cx=(e.touches?.[0]?.clientX??e.clientX)-rect.left;
  const cy=(e.touches?.[0]?.clientY??e.clientY)-rect.top;
  spawnParticles(cx,cy,power);if(getSceneLevel()>=4)spawnSparks(cx,cy);
  checkAchievements();updateStats();
}

function handleSell(){
  if(G.processed<1)return;sfxSell();
  const price=sellPrice();
  const eventMult=G.eventNextSaleMult||1;
  const earned=Math.floor(G.processed)*price*G.rebirthMult*eventMult;
  G.dollars+=earned;G.totalEarned+=earned;G.processed=0;oilLevel=0;
  G.eventNextSaleMult=1;
  flash("+$"+fmt(earned)+(eventMult>1?" ×"+eventMult+"!":""));
  spawnDollarFloat();checkMilestones();checkAchievements();updateStats();renderTab();
  const btn=document.getElementById("sell-btn");btn.style.transform="translateY(2px)";btn.style.boxShadow="none";setTimeout(()=>{btn.style.transform="";btn.style.boxShadow="";},400);
}

function handleBuy(id){
  const u=UPGRADES.find(x=>x.id===id);if(!u)return;
  const cost=upgradeCost(u);
  if(G.dollars<cost){sfxError();flash(t().notEnough,"#e53935");return;}
  sfxBuy();G.dollars-=cost;G.upgrades[u.id]=(G.upgrades[u.id]||0)+1;
  flash("⬆️ "+(G.lang==="en"?u.en:u.es));
  const newLv=getSceneLevel();if(newLv!==sceneLevel){sceneLevel=newLv;buildScene();}
  checkAchievements();updateStats();renderTab();updateRebirthUI();
}

function handleBuyInvestment(id){
  const inv=INVESTMENTS.find(x=>x.id===id);if(!inv)return;
  if((G.investments||[]).includes(id)){sfxError();return;}
  if(G.rebirths<inv.minRebirth){sfxError();flash(G.lang==="es"?"¡Requiere más Renacimientos!":"Requires more Rebirths!","#e53935");return;}
  const cost=investmentCost(inv);
  if(G.dollars<cost){sfxError();flash(t().notEnough,"#e53935");return;}
  sfxInvest();G.dollars-=cost;
  G.investments=G.investments||[];G.investments.push(id);
  const name=G.lang==="en"?inv.en:inv.es;
  flash("💼 "+name,"#42a5f5");
  checkAchievements();updateStats();renderTab();
}

function handleRebirth(){
  if(!canRebirth()){sfxError();flash(G.lang==="es"?"¡Requisitos no cumplidos!":"Requirements not met!","#e53935");return;}
  sfxRebirth();
  const nc=G.rebirths+1;
  // PP formula: 1 base + 1 extra every 2 rebirths (so 1,1,2,2,3,3,4...)
  // Very slow to accumulate — max ~3-4 PP per rebirth at high rebirths
  const ppBase=1+Math.floor(nc/2);
  const pp=Math.min(ppBase,5); // Hard cap: never more than 5 PP per rebirth
  G.rebirths=nc;G.rebirthMult=Math.pow(1.2,nc);G.pp=(G.pp||0)+pp;
  G.barrels=0;G.processed=0;G.dollars=0;G.totalEarned=0;oilLevel=0;G.totalTaps=0;
  G.seenMilestones=[];G.investments=[];G.activeEvent=null;
  UPGRADES.forEach(u=>{G.upgrades[u.id]=0;});
  applyNewGameBonus();
  closeModal();flash("🌟 REBIRTH! ×"+G.rebirthMult.toFixed(2)+" +"+pp+"PP","#ffd700");
  sceneLevel=0;buildScene();checkAchievements();updateStats();renderTab();updateRebirthUI();
}

function handlePrestigeBuy(id){
  const pu=PRESTIGE_UPGRADES.find(x=>x.id===id);if(!pu||G.prestigeBought.includes(id))return;
  if((G.pp||0)<pu.cost){sfxError();flash(t().notEnough,"#e53935");return;}
  sfxPrestige();G.pp-=pu.cost;G.prestigeBought.push(id);
  flash("🌟 "+(G.lang==="en"?pu.en:pu.es),"#ce93d8");updateStats();renderTab();
}

  G.boostActive=true;G.boostEnd=Date.now()+dur;G.barrels*=3;closeModal();

// ══════════════════════ GAME LOOP ══════════════════════
function gameLoop(){
  const now=Date.now(),dt=Math.min((now-lastTime)/1000,0.5);lastTime=now;
  const bps=totalBPS();
  if(bps>0){const g=bps*dt;G.barrels+=g;G.processed+=g*0.8;oilLevel=Math.min(100,oilLevel+g*0.02);}
  if(G.boostActive&&now>G.boostEnd){G.boostActive=false;updateBoostBtn();}
  updateStats();updateOilFill();updateRebirthUI();
  requestAnimationFrame(gameLoop);
}

  document.getElementById("tab-upg").textContent="⬆️ "+tt.upgrades;
  document.getElementById("tab-inv").textContent="💼 "+tt.invest;
  document.getElementById("tab-ach").textContent="🏆 "+tt.achievements;
  document.getElementById("tab-pres").textContent="🌟 "+tt.prestige;
  renderTab();
}

// ══════════════════════ TABS ══════════════════════
function setTab(name){
  currentTab=name;
  ["upgrades","invest","achievements","prestige"].forEach(n=>{
    document.getElementById("tab-"+{upgrades:"upg",invest:"inv",achievements:"ach",prestige:"pres"}[n]).className="tab-btn"+(name===n?" active":"");
  });
  renderTab();
}
function renderTab(){
  const c=document.getElementById("tab-content");
  if(currentTab==="upgrades")renderUpgrades(c);
  else if(currentTab==="invest")renderInvestments(c);
  else if(currentTab==="achievements")renderAchievements(c);
  else renderPrestige(c);
}

function renderUpgrades(c){
  let html="";
  UPGRADES.forEach(u=>{
    const level=G.upgrades[u.id]||0,cost=upgradeCost(u);
    const afford=G.dollars>=cost,maxed=level>=u.max;
    const name=G.lang==="en"?u.en:u.es;
    const pct=(level/u.max*100).toFixed(1);
    const barCol=maxed?"#4caf50":"#f5a623";
    const cardCls="upg-card"+(maxed?" maxed":afford?" afford":"");
    const btnCls="upg-buy-btn"+(maxed?" maxed":afford?" afford":"");
    const btnTxt=maxed?("✓ "+t().maxed):(t().buy+"<br>$"+fmt(cost));
    const statTxt=(u.bps>0?"+"+u.bps+"bps ":"")+(u.tap>0?"+"+u.tap+" tap":"");
    html+=`<div class="${cardCls}"><div class="upg-icon">${u.icon}</div><div class="upg-info"><div class="upg-row"><span class="upg-name${maxed?" maxed":""}">${name}</span><span class="upg-lvl${maxed?" maxed":""}">${level}/${u.max}</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%;background:${barCol}"></div></div><div class="upg-stat">${statTxt}</div></div><button class="${btnCls}" onclick="${maxed?"":("handleBuy('"+u.id+"')")}">${btnTxt}</button></div>`;
  });
  c.innerHTML=html;
}

function renderInvestments(c){
  const owned=G.investments||[];
  let html=`<div style="font-size:6px;color:#8a7f70;margin-bottom:8px;padding:0 2px;line-height:1.8">${G.lang==="es"?"Bonos permanentes para esta partida. Se pierden al Renacer. Se desbloquean con cada Renacimiento.":"Permanent bonuses for this run. Lost on Rebirth. Unlock with each Rebirth."}</div>`;
  INVESTMENTS.forEach(inv=>{
    const isOwned=owned.includes(inv.id);
    const unlocked=G.rebirths>=inv.minRebirth;
    const cost=investmentCost(inv);
    const afford=!isOwned&&unlocked&&G.dollars>=cost;
    const name=G.lang==="en"?inv.en:inv.es;
    const desc=G.lang==="en"?inv.en_d:inv.es_d;
    let btnCls="inv-buy-btn"+(isOwned?" owned":afford?" afford":"");
    let btnTxt=isOwned?"✓ ACTIVO":unlocked?"$"+fmt(cost):"🔒 R"+inv.minRebirth;
    let cardStyle=!unlocked?"opacity:.35;":"";
    html+=`<div class="inv-card${isOwned?" owned":""}" style="${cardStyle}"><div class="inv-icon">${inv.icon}</div><div class="inv-info"><div class="inv-name">${name}${!unlocked?` <span style="font-size:5px;color:#555">· Rebirth ${inv.minRebirth}</span>`:""}</div><div class="inv-desc">${desc}</div></div><button class="${btnCls}" onclick="${isOwned||!unlocked?"":("handleBuyInvestment('"+inv.id+"')")}">${btnTxt}</button></div>`;
  });
  c.innerHTML=html;
}

function renderAchievements(c){
  const bps=totalBPS();
  let html=`<div style="font-size:6px;color:#8a7f70;margin-bottom:8px;padding:0 2px">${G.achievements.length}/${ACHIEVEMENTS.length} ${G.lang==="es"?"completados":"completed"}</div>`;
  ACHIEVEMENTS.forEach(a=>{
    const done=G.achievements.includes(a.id);
    const name=G.lang==="en"?a.en:a.es;
    const desc=G.lang==="en"?a.en_d:a.es_d;
    const reward=G.lang==="en"?a.en_r:a.es_r;
    html+=`<div class="ach-card${done?" unlocked":""}"><div class="ach-icon">${a.icon}</div><div class="ach-info"><div class="ach-name${done?" done":""}">${name}</div><div class="ach-desc">${done?desc:"???"}</div>${done?`<div class="ach-reward">✓ ${reward}</div>`:""}</div><div class="ach-badge">${done?"✅":"🔒"}</div></div>`;
  });
  c.innerHTML=html;
}

function renderPrestige(c){
  const tt=t();
  const itemsPct=(rebirthItemsPct()*100).toFixed(1),moneyPct=(rebirthMoneyPct()*100).toFixed(1);
  const ready=canRebirth();
  const itemsDone=UPGRADES.filter(u=>(G.upgrades[u.id]||0)>=u.max).length;
  const itemsColor=allMaxed()?"#4caf50":"#888",moneyColor=G.dollars>=REBIRTH_MONEY?"#4caf50":"#ffd700";
  const cardCls="rebirth-req-card"+(ready?" can-rebirth":"");
  const btnCls="rebirth-action-btn"+(ready?" can":"");
  const btnTxt=ready?("🌟 "+tt.rebirthConfirm):tt.rebirthLocked;
  const btnClick=ready?"openModal('rebirth')":`sfxError();flash('${tt.rebirthLocked.replace("🔒 ","")}','#e53935')`;
  let html=`<div id="pp-card"><div id="pp-label">Prestige Points</div><div id="pp-val">⭐ ${G.pp||0}</div><div id="pp-sub">Rebirths: ${G.rebirths} · Mult: ×${G.rebirthMult.toFixed(2)}</div></div>
  <div class="${cardCls}"><div class="rr-title${ready?" can":""}">🌟 ${tt.rebirthTitle}</div><div class="rr-desc">${tt.rebirthDesc}</div>
  <div class="rr-req-row"><span class="rr-req-label${allMaxed()?" done":""}">${allMaxed()?"✓":"("+itemsDone+"/"+UPGRADES.length+")"} ${tt.rebirthReqItems}</span></div>
  <div class="req-prog"><div class="req-prog-fill" style="width:${itemsPct}%;background:${itemsColor}"></div></div>
  <div class="rr-req-row" style="margin-top:3px"><span class="rr-req-label${G.dollars>=REBIRTH_MONEY?" done":""}">${G.dollars>=REBIRTH_MONEY?"✓":"$"+fmt(G.dollars)+" / $500M"} ${tt.rebirthReqMoney}</span></div>
  <div class="req-prog"><div class="req-prog-fill" style="width:${moneyPct}%;background:${moneyColor}"></div></div>
  <button class="${btnCls}" onclick="${btnClick}">${btnTxt}</button></div>`;
  PRESTIGE_UPGRADES.forEach(pu=>{
    const owned=G.prestigeBought.includes(pu.id),afford=(G.pp||0)>=pu.cost;
    const unlocked=G.rebirths>=pu.minRebirth;
    const name=G.lang==="en"?pu.en:pu.es,desc=G.lang==="en"?pu.en_d:pu.es_d;
    let btnTxt=owned?"✓":unlocked?("⭐"+pu.cost):("🔒 R"+pu.minRebirth);
    let btnCls="prest-buy-btn"+(owned?"":unlocked&&afford?" afford":"");
    let cardStyle=!unlocked&&!owned?"opacity:.35;":"";
    html+=`<div class="prest-card${owned?" owned":""}" style="${cardStyle}"><div class="prest-inner"><span class="prest-icon">${pu.icon}</span><div style="flex:1"><div class="prest-name" style="color:${owned?"#ce93d8":"#e8e0d0"}">${name} ${owned?"✓":""}</div><div class="prest-desc">${desc}${!unlocked&&!owned?` · <span style="color:#555">Rebirth ${pu.minRebirth}</span>`:""}</div></div>${!owned?`<button class="${btnCls}" onclick="${unlocked?("handlePrestigeBuy('"+pu.id+"')"):"sfxError()"}">${btnTxt}</button>`:""}</div></div>`;
  });
  c.innerHTML=html;
}

// ══════════════════════ MODALS ══════════════════════
function openModal(type){
  currentModal=type;const box=document.getElementById("modal-box"),tt=t();
  if(type==="rebirth"){
    const nextMult=Math.pow(1.2,G.rebirths+1);
    const nc=G.rebirths+1;
    const pp=Math.min(1+Math.floor(nc/2),5);
    box.innerHTML=`<div class="modal-title gold">🌟 ${tt.rebirthTitle}</div><div class="modal-desc">${tt.rebirthDesc}</div><div class="modal-row"><span class="modal-row-label">${tt.rebirthCount}:</span><span style="color:#ffd700">${G.rebirths} → ${G.rebirths+1}</span></div><div class="modal-row"><span class="modal-row-label">${tt.rebirthBonus}:</span><span style="color:#4caf50">×${G.rebirthMult.toFixed(2)} → ×${nextMult.toFixed(2)}</span></div><div class="modal-row"><span class="modal-row-label">Prestige Points:</span><span style="color:#ce93d8">+${pp} PP</span></div><div class="btn-row" style="margin-top:12px"><button class="btn-sec" onclick="closeModal()">${tt.rebirthCancel}</button><button class="btn-gold" onclick="handleRebirth()">${tt.rebirthConfirm}</button></div>`;
  }else if(type==="boost"){
    const active=G.boostActive&&Date.now()<G.boostEnd;
    box.innerHTML=`<div class="modal-title blue">🚀 ${tt.adsTitle}</div><div class="modal-desc">${tt.adsDesc}</div>${active?`<div style="text-align:center;color:#4caf50;font-size:10px;margin-bottom:12px">${tt.adsActive}: ${fmtTime(G.boostEnd-Date.now())}</div>`:""}<div class="btn-row"><button class="btn-sec" onclick="closeModal()">${tt.close}</button>${!active?`<button class="btn-blue" onclick="handleBoost()">${tt.adsWatch}</button>`:""}</div>`;
  }else if(type==="settings"){
    box.innerHTML=`<div class="modal-title">⚙️ ${tt.settings}</div><div class="settings-row"><span class="settings-label">${tt.language}:</span><div style="display:flex;gap:6px"><button class="lang-btn${G.lang==="es"?" active":""}" onclick="setLang('es')">🇪🇸 ES</button><button class="lang-btn${G.lang==="en"?" active":""}" onclick="setLang('en')">🇺🇸 EN</button></div></div><div class="settings-row"><span class="settings-label">${tt.tutorial}:</span><button class="small-btn" onclick="openTutorial()">📖</button></div><div class="settings-row"><span class="settings-label">${tt.save}:</span><button class="small-btn" onclick="saveGame();flash('💾 Guardado!','#4caf50');closeModal()">💾</button></div><div class="settings-row"><span class="settings-label">${tt.reset}:</span><button class="danger-btn" onclick="confirmReset()">🗑️</button></div><div style="text-align:center;margin-top:8px"><button class="btn-primary" onclick="closeModal()">${tt.close}</button></div>`;
  }
  document.getElementById("modal-overlay").classList.add("show");
}
function openOfflineModal(ms,barrels){
  const tt=t();currentModal="offline";
  document.getElementById("modal-box").innerHTML=`<div class="modal-title">${tt.offline_title}</div><div class="modal-desc">${tt.offline_away} <span style="color:#f5a623">${fmtTime(ms)}</span><br><br>${tt.offline_earned}<br><span class="offline-barrel">🛢️ ${fmt(barrels)}</span></div><div class="btn-row"><button class="btn-primary" onclick="claimOffline(${barrels})">${tt.offline_claim}</button></div>`;
  document.getElementById("modal-overlay").classList.add("show");
  if(!G.tutDone)setTimeout(showTutorial,500);
}
function claimOffline(barrels){G.barrels+=barrels;closeModal();updateStats();}
function closeModal(){document.getElementById("modal-overlay").classList.remove("show");currentModal=null;}
function closeModalIfBackdrop(e){if(e.target===document.getElementById("modal-overlay")||e.target===document.getElementById("modal-backdrop"))closeModal();}
function confirmReset(){if(confirm("¿Borrar todo el progreso?\nReset all progress?")){localStorage.removeItem(SAVE_KEY);location.reload();}}
function setLang(l){G.lang=l;closeModal();updateLang();updateStats();}

// ══════════════════════ TUTORIAL ══════════════════════
function showTutorial(){tutStep=0;renderTutStep();document.getElementById("tutorial-overlay").classList.add("show");}
function openTutorial(){closeModal();showTutorial();}
function renderTutStep(){
  const steps=t().tuts,s=steps[tutStep];
  document.getElementById("tut-step").textContent=(tutStep+1)+" / "+steps.length;
  document.getElementById("tut-title").textContent=s.t;
  document.getElementById("tut-desc").textContent=s.d;
  const tt=t();
  document.getElementById("tut-next-btn").textContent=tutStep===steps.length-1?tt.tutorial_done:tt.tutorial_next;
  document.getElementById("tut-skip-btn").textContent=tt.tutorial_skip;
}
function tutNext(){const steps=t().tuts;if(tutStep<steps.length-1){tutStep++;renderTutStep();}else tutSkip();}
function tutSkip(){G.tutDone=true;document.getElementById("tutorial-overlay").classList.remove("show");}

// ══════════════════════ INIT ══════════════════════
loadGame();
updateLang();updateStats();renderTab();
sceneLevel=getSceneLevel();buildScene();
setInterval(saveGame,10000);
startEventSystem();
gameLoop();
</script>
</body>
</html>
