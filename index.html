function fmt(n) {
  if (n >= 1e12) return (n/1e12).toFixed(2)+"T";
  if (n >= 1e9)  return (n/1e9).toFixed(2)+"B";
  if (n >= 1e6)  return (n/1e6).toFixed(2)+"M";
  if (n >= 1e3)  return (n/1e3).toFixed(1)+"K";
  return Math.floor(n).toString();
}
function fmtFull(n) {
  return Math.floor(n).toLocaleString();
}
function fmtTime(ms) {
  const s = Math.ceil(ms/1000), m = Math.floor(s/60), ss = s%60;
  return `${m}:${ss.toString().padStart(2,"0")}`;
}

function OilEmpire() {
  const [lang, setLang]                 = useState("es");
  const t = T[lang];

  const [barrels, setBarrels]           = useState(0);
  const [processed, setProcessed]       = useState(0);
  const [dollars, setDollars]           = useState(0);
  const [totalEarned, setTotalEarned]   = useState(0);
  const [upgrades, setUpgrades]         = useState(() =>
    Object.fromEntries(UPGRADES_CONFIG.map(u=>[u.id,0])));
  const [rebirths, setRebirths]         = useState(0);
  const [rebirthMult, setRebirthMult]   = useState(1.0);
  const [prestigePoints, setPrestigePoints] = useState(0);
  const [prestigeBought, setPrestigeBought] = useState([]);
  const [seenMilestones, setSeenMilestones] = useState([]);

  const [tab, setTab]         = useState("upgrades");
  const [modal, setModal]     = useState(null);
  const [tutStep, setTutStep] = useState(0);
  const [tutDone, setTutDone] = useState(false);
  const [particles, setParticles] = useState([]);
  const [drillAnim, setDrillAnim] = useState(false);
  const [flashMsg, setFlashMsg]   = useState(null);
  const [comboCount, setComboCount] = useState(0);
  const comboTimerRef = useRef(null);
  const [boostActive, setBoostActive] = useState(false);
  const [boostEnd, setBoostEnd]       = useState(0);
  const [sellAnim, setSellAnim]       = useState(false);
  const [oilLevel, setOilLevel]       = useState(0);
  const [rebirthShake, setRebirthShake] = useState(false);
  const lastTimeRef = useRef(Date.now());

  const tutSteps = [
    {tk:"tut0_title",dk:"tut0_desc"},{tk:"tut1_title",dk:"tut1_desc"},
    {tk:"tut2_title",dk:"tut2_desc"},{tk:"tut3_title",dk:"tut3_desc"},
    {tk:"tut4_title",dk:"tut4_desc"},{tk:"tut5_title",dk:"tut5_desc"},
    {tk:"tut6_title",dk:"tut6_desc"},
  ];

  // ── Computed ──
  const getTotalBPS = useCallback(() => {
    let bps = 0;
    UPGRADES_CONFIG.forEach(u => { bps += u.bpsPerLevel * (upgrades[u.id]||0); });
    const boost = boostActive && Date.now() < boostEnd ? 3 : 1;
    const prest = prestigeBought.includes("oil_rush") ? 2.5 : 1;
    return bps * rebirthMult * boost * prest;
  }, [upgrades, rebirthMult, boostActive, boostEnd, prestigeBought]);

  const getTapPower = useCallback(() => {
    let tp = 1;
    UPGRADES_CONFIG.forEach(u => { if(u.tapBonus) tp += u.tapBonus*(upgrades[u.id]||0); });
    const boost = boostActive && Date.now() < boostEnd ? 3 : 1;
    const combo = 1 + Math.min(comboCount * 0.08, 1.5);
    const prest1 = prestigeBought.includes("golden_drill") ? 1.75 : 1;
    const prest2 = prestigeBought.includes("deep_drill") ? 2 : 1;
    return tp * rebirthMult * boost * combo * prest1 * prest2;
  }, [upgrades, rebirthMult, boostActive, boostEnd, comboCount, prestigeBought]);

  const getUpgradeCost = useCallback((u) => {
    return Math.floor(u.baseCost * Math.pow(u.costMult, upgrades[u.id]||0));
  }, [upgrades]);

  const getSellPrice = useCallback(() => {
    return 90 * (prestigeBought.includes("black_gold") ? 1.35 : 1);
  }, [prestigeBought]);

  // ── Rebirth requirements ──
  const allMaxed = useMemo(() =>
    UPGRADES_CONFIG.every(u => (upgrades[u.id]||0) >= u.maxLevel),
    [upgrades]);

  const canRebirth = allMaxed && dollars >= REBIRTH_MONEY_REQ;

  const rebirthProgress = useMemo(() => {
    const moneyPct = Math.min(1, dollars / REBIRTH_MONEY_REQ);
    const itemsDone = UPGRADES_CONFIG.filter(u => (upgrades[u.id]||0) >= u.maxLevel).length;
    const itemsPct  = itemsDone / UPGRADES_CONFIG.length;
    return { moneyPct, itemsPct, itemsDone, total: UPGRADES_CONFIG.length };
  }, [dollars, upgrades]);

  // ── Save/Load ──
  const buildSave = useCallback(() => ({
    barrels, processed, dollars, totalEarned, upgrades,
    rebirths, rebirthMult, prestigePoints, prestigeBought,
    tutDone, lang, seenMilestones, savedAt: Date.now(),
  }), [barrels, processed, dollars, totalEarned, upgrades,
       rebirths, rebirthMult, prestigePoints, prestigeBought,
       tutDone, lang, seenMilestones]);

  const saveGame = useCallback(() => {
    try { localStorage.setItem("oilempire2_save", JSON.stringify(buildSave())); } catch {}
  }, [buildSave]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("oilempire2_save");
      if (raw) {
        const s = JSON.parse(raw);
        setBarrels(s.barrels||0); setProcessed(s.processed||0);
        setDollars(s.dollars||0); setTotalEarned(s.totalEarned||0);
        setUpgrades(s.upgrades||Object.fromEntries(UPGRADES_CONFIG.map(u=>[u.id,0])));
        setRebirths(s.rebirths||0); setRebirthMult(s.rebirthMult||1);
        setPrestigePoints(s.prestigePoints||0); setPrestigeBought(s.prestigeBought||[]);
        setTutDone(s.tutDone||false); setLang(s.lang||"es");
        setSeenMilestones(s.seenMilestones||[]);
        if (s.savedAt) {
          const offSec = (Date.now()-s.savedAt)/1000;
          if (offSec > 30) {
            const bpsV = UPGRADES_CONFIG.reduce((a,u)=>a+u.bpsPerLevel*(s.upgrades?.[u.id]||0),0);
            const ob = Math.floor(bpsV * offSec * (s.rebirthMult||1) * 0.5);
            if (ob > 0) { setModal({type:"offline",ms:Date.now()-s.savedAt,barrels:ob}); return; }
          }
        }
        if (!s.tutDone) setModal("tutorial");
      } else { setModal("tutorial"); }
    } catch { setModal("tutorial"); }
  }, []);

  useEffect(() => {
    const id = setInterval(saveGame, 10000);
    return () => clearInterval(id);
  }, [saveGame]);

  // ── Game Loop ──
  useEffect(() => {
    let frame;
    const loop = () => {
      const now = Date.now();
      const dt  = Math.min((now - lastTimeRef.current)/1000, 0.5);
      lastTimeRef.current = now;
      const bps = getTotalBPS();
      if (bps > 0) {
        const g = bps * dt;
        setBarrels(b => b+g);
        setProcessed(p => p+g*0.8);
        setOilLevel(l => Math.min(100, l+g*0.02));
      }
      if (boostActive && now > boostEnd) setBoostActive(false);
      setParticles(ps => ps.filter(p => now-p.born < 1300));
      frame = requestAnimationFrame(loop);
    };
    frame = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(frame);
  }, [getTotalBPS, boostActive, boostEnd]);

  // ── Milestone checker ──
  useEffect(() => {
    MILESTONES.forEach(m => {
      if (!seenMilestones.includes(m.id) && totalEarned >= m.money) {
        setSeenMilestones(sm => [...sm, m.id]);
        flash(`🏆 ${lang==="en"?m.textEn:m.textEs}`, "#ffd700");
      }
    });
  }, [totalEarned, seenMilestones, lang]);

  // ── Flash ──
  const flashRef = useRef(null);
  const flash = (msg, color) => {
    setFlashMsg({msg, color: color||C.accent});
    if (flashRef.current) clearTimeout(flashRef.current);
    flashRef.current = setTimeout(() => setFlashMsg(null), 1800);
  };

  // ── Actions ──
  const handleTap = useCallback((e) => {
    e.preventDefault();
    const power = getTapPower();
    setBarrels(b=>b+power);
    setProcessed(p=>p+power*0.8);
    setOilLevel(l=>Math.min(100,l+power*0.15));
    setDrillAnim(true);
    setTimeout(()=>setDrillAnim(false),130);
    setComboCount(c=>c+1);
    if (comboTimerRef.current) clearTimeout(comboTimerRef.current);
    comboTimerRef.current = setTimeout(()=>setComboCount(0),1500);
    const rect = e.currentTarget.getBoundingClientRect();
    const cx = (e.touches?.[0]?.clientX ?? e.clientX) - rect.left;
    const cy = (e.touches?.[0]?.clientY ?? e.clientY) - rect.top;
    const newPs = Array.from({length:5}, ()=>({
      id:pid++, x:cx+(Math.random()-.5)*50, y:cy+(Math.random()-.5)*30,
      born:Date.now(),
      text: Math.random()>.6 ? `+${Math.ceil(power)}` : (Math.random()>.5?"🛢️":"💧"),
    }));
    setParticles(ps=>[...ps.slice(-30),...newPs]);
  }, [getTapPower]);

  const handleSell = useCallback(() => {
    if (processed < 1) return;
    const price = getSellPrice();
    const earned = Math.floor(processed) * price * rebirthMult;
    setDollars(d=>d+earned);
    setTotalEarned(te=>te+earned);
    setProcessed(0); setOilLevel(0);
    setSellAnim(true); setTimeout(()=>setSellAnim(false),500);
    flash(`+$${fmt(earned)}`);
  }, [processed, getSellPrice, rebirthMult]);

  const handleBuy = useCallback((upg) => {
    const cost = getUpgradeCost(upg);
    if (dollars < cost) { flash(t.notEnough, C.red); return; }
    setDollars(d=>d-cost);
    setUpgrades(u=>({...u,[upg.id]:(u[upg.id]||0)+1}));
    const name = lang==="en"?upg.nameEn:upg.nameEs;
    flash(`⬆️ ${name}`);
  }, [dollars, getUpgradeCost, lang, t]);

  const handleRebirth = useCallback(() => {
    if (!canRebirth) { flash(t.req_not_met, C.red); return; }
    const nc = rebirths+1;
    const pp = Math.max(2, Math.floor(Math.log2(Math.max(totalEarned/1000000,2))));
    setRebirths(nc);
    setRebirthMult(Math.pow(1.2, nc));
    setPrestigePoints(pv=>pv+pp);
    setBarrels(0); setProcessed(0); setDollars(0); setTotalEarned(0); setOilLevel(0);
    setSeenMilestones([]);
    setUpgrades(Object.fromEntries(UPGRADES_CONFIG.map(u=>[u.id,0])));
    setModal(null);
    flash("🌟 REBIRTH! ×"+Math.pow(1.2,nc).toFixed(2), C.gold);
  }, [canRebirth, rebirths, totalEarned, t]);

  const handlePrestigeBuy = useCallback((pu) => {
    if (prestigeBought.includes(pu.id)) return;
    if (prestigePoints < pu.cost) { flash(t.notEnough, C.red); return; }
    setPrestigePoints(pp=>pp-pu.cost);
    setPrestigeBought(pb=>[...pb,pu.id]);
    flash(`🌟 ${lang==="en"?pu.nameEn:pu.nameEs}`, C.purple);
  }, [prestigeBought, prestigePoints, lang, t]);

  const handleBoostAd = useCallback(() => {
    const dur = prestigeBought.includes("mega_boost") ? 20*60*1000 : 10*60*1000;
    setBoostActive(true); setBoostEnd(Date.now()+dur);
    setBarrels(b=>b*3); flash("🚀 BOOST ×3!", "#64b5f6"); setModal(null);
  }, [prestigeBought]);

  const tutNext = () => {
    if (tutStep < tutSteps.length-1) setTutStep(s=>s+1);
    else { setTutDone(true); setModal(null); }
  };
  const tutSkip = () => { setTutDone(true); setModal(null); };

  const bps     = getTotalBPS();
  const boostRem = boostActive ? boostEnd - Date.now() : 0;

  // ── Oil Pump Pixel Art ──
  const OilPump = ({anim}) => {
    const yo = anim ? 3 : 0;
    return (
      <svg width="72" height="72" viewBox="0 0 18 18"
        style={{imageRendering:"pixelated",
          filter:`drop-shadow(0 0 8px rgba(245,166,35,${anim?0.9:0.5}))`,
          transform:`translateY(${anim?3:0}px) scale(${anim?0.96:1})`,
          transition:"transform 0.09s"}}>
        {/* Base platform */}
        <rect x="0" y="15" width="18" height="3" fill="#2a1800"/>
        <rect x="1" y="15" width="16" height="2" fill="#3a2400"/>
        {/* Left leg */}
        <rect x="2"  y="6" width="2" height="10" fill="#4a3200"/>
        <rect x="2"  y="6" width="1" height="10" fill="#5a4200"/>
        {/* Right leg */}
        <rect x="14" y="6" width="2" height="10" fill="#4a3200"/>
        <rect x="15" y="6" width="1" height="10" fill="#5a4200"/>
        {/* Cross brace bottom */}
        <rect x="2" y="12" width="14" height="1" fill="#5a4200"/>
        {/* Cross brace mid */}
        <rect x="3" y="9"  width="12" height="1" fill="#5a4200"/>
        {/* Tower top */}
        <rect x="4"  y="3" width="10" height="1" fill="#6a5200"/>
        <rect x="7"  y="1" width="4"  height="3" fill="#7a6200"/>
        <rect x="8"  y="0" width="2"  height="2" fill="#f5a623"/>
        {/* Flame */}
        <rect x="8"  y="0" width="1"  height="1" fill="#ff4400" opacity=".9"/>
        <rect x="9"  y="0" width="1"  height="1" fill="#ffaa00" opacity=".9"/>
        {/* Pump beam (horizontal bar) */}
        <rect x="3" y={4+yo}  width="12" height="2" fill="#f5a623"/>
        <rect x="4" y={4+yo}  width="10" height="1" fill="#ffc84a"/>
        {/* Pivot block */}
        <rect x="7" y={3+yo}  width="4" height="4" fill="#c47d10"/>
        <rect x="8" y={4+yo}  width="2" height="2" fill="#e09020"/>
        {/* Pump head right */}
        <rect x="13" y={4+yo} width="4" height="3" fill="#d4820e"/>
        <rect x="13" y={4+yo} width="3" height="2" fill="#e89218"/>
        {/* Drill rod */}
        <rect x="14" y={6+yo} width="2" height="9-yo} fill="#777"/>
        <rect x="14" y={6+yo} width="1" height={9-yo} fill="#999"/>
        {/* Oil drops when animating */}
        {anim && <>
          <rect x="14" y="14" width="1" height="1" fill="#1a4500"/>
          <rect x="15" y="15" width="1" height="1" fill="#0f2e00"/>
          <rect x="5"  y={3+yo} width="1" height="1" fill="#fff" opacity=".8"/>
          <rect x="12" y={3+yo} width="1" height="1" fill="#ffe066" opacity=".9"/>
        </>}
      </svg>
    );
  };

  // ── Progress bar helper ──
  const ProgressBar = ({pct, color, bg}) => (
    <div style={{background:bg||"#1a1a1a",borderRadius:2,height:8,overflow:"hidden",border:"1px solid #333"}}>
      <div style={{height:"100%",width:`${Math.min(100,pct*100).toFixed(1)}%`,background:color||C.accent,transition:"width 0.4s ease",borderRadius:2}}/>
    </div>
  );

  // ── Root style ──
  const rootStyle = {
    fontFamily:PF, background:C.bg, height:"100dvh",
    maxWidth:440, margin:"0 auto", color:C.text,
    userSelect:"none", WebkitUserSelect:"none",
    display:"flex", flexDirection:"column", overflow:"hidden", position:"relative",
  };

  // ─── RENDER ──────────────────────────────────────────────────────────────────
  return (
    <div style={rootStyle}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(180deg,#1a0a00,#08080a)",borderBottom:`2px solid ${C.accent}`,padding:"env(safe-area-inset-top,6px) 12px 7px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{fontSize:11,color:C.accent,letterSpacing:1.5,textShadow:`0 0 14px ${C.accent}90`}}>{t.title}</div>
        <div style={{display:"flex",gap:4}}>
          <button style={{background:"none",border:`1px solid ${C.panelBorder}`,color:boostActive?"#64b5f6":C.textDim,padding:"5px 7px",fontSize:8,fontFamily:PF,borderRadius:2}} onClick={()=>setModal("boost")}>
            {boostActive?`🚀${fmtTime(boostRem)}`:"🚀"}
          </button>
          <button
            style={{background:"none",border:`1px solid ${canRebirth?"#ffd700":C.panelBorder}`,color:canRebirth?"#ffd700":C.textDim,padding:"5px 7px",fontSize:8,fontFamily:PF,borderRadius:2,animation:canRebirth?"rebirthGlow 1.5s ease infinite":"none"}}
            onClick={()=>setModal("rebirth")}>🌟</button>
          <button style={{background:"none",border:`1px solid ${C.panelBorder}`,color:C.textDim,padding:"5px 7px",fontSize:8,fontFamily:PF,borderRadius:2}} onClick={()=>setModal("settings")}>⚙️</button>
        </div>
      </div>

      {/* STATS BAR */}
      <div style={{background:C.panel,borderBottom:`1px solid ${C.panelBorder}`,padding:"7px 12px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,flexShrink:0}}>
        {[
          {label:`🛢️ ${t.barrels}`, val:fmt(barrels), sub:bps>0?`+${fmt(bps)}${t.perSecond}`:null, sc:"#4caf50"},
          {label:`⚗️ ${t.processed}`, val:fmt(processed), sub:t.sell_price, sc:C.textDim},
          {label:`💵 ${t.dollars}`, val:`$${fmt(dollars)}`, vc:C.accent, sub:`$${fmt(totalEarned)} total`, sc:C.textDim},
        ].map((s,i)=>(
          <div key={i} style={{textAlign:"center"}}>
            <span style={{fontSize:6,color:C.textDim,display:"block",marginBottom:1}}>{s.label}</span>
            <span style={{fontSize:10,color:s.vc||C.text,display:"block"}}>{s.val}</span>
            {s.sub&&<span style={{fontSize:6,color:s.sc,display:"block"}}>{s.sub}</span>}
          </div>
        ))}
      </div>

      {/* DRILL AREA */}
      <div style={{position:"relative",height:210,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 25% 75%,#0d2000,transparent 55%),radial-gradient(ellipse at 75% 20%,#1a1000,transparent 55%),linear-gradient(180deg,#090909,#0a0d04)"}}/>
        <div style={{position:"absolute",inset:0,backgroundImage:"linear-gradient(rgba(245,166,35,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,0.025) 1px,transparent 1px)",backgroundSize:"16px 16px"}}/>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:`${oilLevel}%`,background:"linear-gradient(0deg,#0c2200,#1a4a0070)",transition:"height 0.5s ease"}}/>

        {comboCount>3&&<div style={{position:"absolute",top:8,left:10,fontSize:8,color:"#ff6b35",zIndex:3,textShadow:"0 0 10px #ff6b35",fontFamily:PF}}>{t.combo_tap} ×{comboCount}</div>}
        {bps>0&&<div style={{position:"absolute",top:8,right:10,fontSize:6,color:C.textDim,zIndex:3,fontFamily:PF}}>⚡{fmt(bps)}{t.perSecond}</div>}

        {/* Rebirth progress bar if close */}
        {rebirthProgress.moneyPct > 0.1 && !canRebirth && (
          <div style={{position:"absolute",bottom:6,left:12,right:12,zIndex:3}}>
            <div style={{fontSize:6,color:C.textDim,marginBottom:2,fontFamily:PF}}>🌟 {fmt(dollars)}/{fmt(REBIRTH_MONEY_REQ)}</div>
            <ProgressBar pct={rebirthProgress.moneyPct} color="#ffd700" bg="#1a1400"/>
          </div>
        )}
        {canRebirth && (
          <div style={{position:"absolute",bottom:6,left:12,right:12,zIndex:3,textAlign:"center"}}>
            <div style={{fontSize:7,color:"#ffd700",fontFamily:PF,animation:"rebirthGlow 1s ease infinite"}}>⚡ {t.rebirthConfirm} ⚡</div>
          </div>
        )}

        {/* DRILL BUTTON */}
        <button
          style={{position:"relative",zIndex:2,width:138,height:138,borderRadius:"50%",border:`4px solid ${C.accent}`,background:"radial-gradient(circle at 38% 32%,#3e2c00,#150f00)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"transform 0.08s",transform:drillAnim?"scale(0.91)":"scale(1)",animation:drillAnim?"none":"oilPulse 2.2s ease infinite",WebkitTapHighlightColor:"transparent",outline:"none",touchAction:"manipulation"}}
          onPointerDown={handleTap}
        >
          <OilPump anim={drillAnim}/>
          <div style={{fontSize:5,color:C.accentDark,marginTop:3,textAlign:"center",fontFamily:PF,letterSpacing:.5}}>{t.tap}</div>
        </button>

        {/* Particles */}
        {particles.map(p=>{
          const age=(Date.now()-p.born)/1300;
          return (
            <div key={p.id} style={{position:"absolute",left:p.x,top:p.y+45,fontSize:8,color:C.accent,fontFamily:PF,pointerEvents:"none",zIndex:10,opacity:Math.max(0,1-age),transform:`translateY(${-age*65}px) scale(${Math.max(0.2,1-age*0.5)})`,fontWeight:"bold"}}>
              {p.text}
            </div>
          );
        })}

        {/* Flash */}
        {flashMsg&&<div style={{position:"absolute",top:"42%",left:"50%",transform:"translateX(-50%) translateY(-50%)",background:"rgba(0,0,0,0.88)",border:`1px solid ${flashMsg.color}`,padding:"7px 14px",fontSize:8,color:flashMsg.color,borderRadius:3,pointerEvents:"none",zIndex:50,whiteSpace:"nowrap",fontFamily:PF,animation:"flashIn 1.8s ease forwards"}}>{flashMsg.msg}</div>}
      </div>

      {/* SELL ROW */}
      <div style={{padding:"6px 12px",display:"flex",gap:8,flexShrink:0}}>
        <button
          style={{flex:1,padding:"10px 4px",background:`linear-gradient(180deg,${C.green},#2e7d32)`,border:"2px solid #81c784",color:"#fff",fontSize:7,fontFamily:PF,borderRadius:3,boxShadow:sellAnim?"none":"0 3px 0 #1b5e20",transform:sellAnim?"translateY(2px)":"translateY(0)",transition:"transform .1s,box-shadow .1s",touchAction:"manipulation"}}
          onClick={handleSell}
        >
          💰 {t.sell}<br/><span style={{fontSize:6,opacity:.8}}>{fmt(processed)} × ${getSellPrice()%1===0?getSellPrice():getSellPrice().toFixed(0)}</span>
        </button>
        <button
          style={{padding:"10px 10px",background:boostActive?"linear-gradient(180deg,#4a148c,#1a0050)":"linear-gradient(180deg,#0d47a1,#060d2e)",border:`2px solid ${boostActive?"#ce93d8":"#1565c0"}`,color:"#fff",fontSize:6,fontFamily:PF,borderRadius:3,textAlign:"center",lineHeight:1.6,boxShadow:boostActive?"0 3px 0 #12003d":"0 3px 0 #001040",touchAction:"manipulation",minWidth:70}}
          onClick={()=>setModal("boost")}
        >
          {boostActive?<>🚀 ACTIVE<br/>{fmtTime(boostRem)}</>:<>🚀 {t.adsTitle}</>}
        </button>
      </div>

      {/* TAB BAR */}
      <div style={{display:"flex",borderBottom:`2px solid ${C.panelBorder}`,background:C.panel,flexShrink:0}}>
        {[["upgrades","⬆️ "+t.upgrades],["prestige","🌟 "+t.prestige_shop]].map(([key,label])=>(
          <button key={key} style={{flex:1,padding:"8px 4px",background:tab===key?C.panelBorder:"none",border:"none",borderBottom:tab===key?`2px solid ${C.accent}`:"2px solid transparent",color:tab===key?C.accent:C.textDim,fontSize:7,fontFamily:PF,cursor:"pointer",touchAction:"manipulation"}} onClick={()=>setTab(key)}>
            {label}
          </button>
        ))}
      </div>

      {/* TAB CONTENT */}
      <div style={{flex:1,overflowY:"auto",padding:"8px 8px 12px",WebkitOverflowScrolling:"touch"}}>

        {/* ── UPGRADES TAB ── */}
        {tab==="upgrades" && UPGRADES_CONFIG.map(upg => {
          const level   = upgrades[upg.id]||0;
          const cost    = getUpgradeCost(upg);
          const afford  = dollars >= cost;
          const maxed   = level >= upg.maxLevel;
          const name    = lang==="en"?upg.nameEn:upg.nameEs;
          const pct     = level/upg.maxLevel;
          return (
            <div key={upg.id} style={{background:C.panel,border:`1px solid ${maxed?"#2a5a00":afford?"#2a2a2a":"#141414"}`,borderRadius:4,padding:"8px 10px",marginBottom:6,display:"flex",alignItems:"center",gap:8,opacity:maxed?1:afford?1:0.6,transition:"opacity 0.2s"}}>
              <div style={{fontSize:20,width:28,textAlign:"center",flexShrink:0}}>{upg.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                  <span style={{fontSize:6,color:maxed?C.green:C.text,fontFamily:PF}}>{name}</span>
                  <span style={{fontSize:6,color:maxed?C.green:C.textDim,fontFamily:PF}}>{level}/{upg.maxLevel}</span>
                </div>
                <ProgressBar pct={pct} color={maxed?"#4caf50":C.accent} bg="#0a0a0a"/>
                <div style={{fontSize:5,color:C.textDim,fontFamily:PF,marginTop:2}}>
                  {upg.bpsPerLevel>0&&`+${upg.bpsPerLevel}bps `}{upg.tapBonus>0&&`+${upg.tapBonus}tap`}
                </div>
              </div>
              <button
                style={{padding:"7px 6px",minWidth:52,background:maxed?"linear-gradient(180deg,#1a3a00,#0f2000)":afford?`linear-gradient(180deg,${C.accent},${C.accentDark})`:"linear-gradient(180deg,#1e1e1e,#0f0f0f)",border:`1px solid ${maxed?"#2a5a00":afford?C.accentDark:"#222"}`,color:maxed?C.green:afford?"#000":"#3a3a3a",fontSize:6,fontFamily:PF,borderRadius:2,flexShrink:0,textAlign:"center",lineHeight:1.7,boxShadow:afford&&!maxed?`0 2px 0 ${C.accentDark}`:"none",touchAction:"manipulation"}}
                onClick={()=>!maxed&&handleBuy(upg)}
              >
                {maxed?<>✓ MAX</>:<>{t.upgradeBuy}<br/>${fmt(cost)}</>}
              </button>
            </div>
          );
        })}

        {/* ── PRESTIGE TAB ── */}
        {tab==="prestige" && (
          <>
            {/* Prestige points card */}
            <div style={{background:"#100820",border:"1px solid #4a1a7a",borderRadius:4,padding:10,marginBottom:8,textAlign:"center"}}>
              <div style={{fontSize:7,color:"#ce93d8",marginBottom:3,fontFamily:PF}}>Prestige Points</div>
              <div style={{fontSize:20,color:"#e040fb"}}>⭐ {prestigePoints}</div>
              <div style={{fontSize:6,color:C.textDim,marginTop:3,fontFamily:PF}}>Rebirths: {rebirths} · Mult: ×{rebirthMult.toFixed(2)}</div>
            </div>

            {/* Rebirth button with requirements */}
            <div style={{background:canRebirth?"#1a1200":"#0f0c00",border:`2px solid ${canRebirth?"#ffd700":"#2a2000"}`,borderRadius:4,padding:10,marginBottom:8,animation:canRebirth?"rebirthGlow 1.5s ease infinite":"none"}}>
              <div style={{fontSize:8,color:canRebirth?"#ffd700":"#6a5a00",fontFamily:PF,marginBottom:6,textAlign:"center"}}>🌟 {t.rebirthTitle}</div>
              <div style={{fontSize:6,color:C.textDim,fontFamily:PF,marginBottom:8,lineHeight:1.9}}>{t.rebirthDesc}</div>

              {/* Requirements */}
              <div style={{fontSize:6,color:C.textDim,fontFamily:PF,marginBottom:4}}>{t.rebirthReq}</div>
              {/* Items progress */}
              <div style={{display:"flex",justifyContent:"space-between",fontSize:6,fontFamily:PF,marginBottom:3}}>
                <span style={{color:allMaxed?C.green:"#888"}}>
                  {allMaxed?"✓":rebirthProgress.itemsDone+"/"+rebirthProgress.total} {t.rebirthReqItems}
                </span>
              </div>
              <ProgressBar pct={rebirthProgress.itemsPct} color={allMaxed?"#4caf50":"#888"} bg="#0a0a0a"/>
              {/* Money progress */}
              <div style={{display:"flex",justifyContent:"space-between",fontSize:6,fontFamily:PF,margin:"6px 0 3px"}}>
                <span style={{color:dollars>=REBIRTH_MONEY_REQ?C.green:"#888"}}>
                  {dollars>=REBIRTH_MONEY_REQ?"✓":"$"+fmt(dollars)+" / $500M"} {t.rebirthReqMoney}
                </span>
              </div>
              <ProgressBar pct={rebirthProgress.moneyPct} color={dollars>=REBIRTH_MONEY_REQ?"#4caf50":"#ffd700"} bg="#0a0a0a"/>

              <button
                style={{width:"100%",padding:"10px",marginTop:10,background:canRebirth?"linear-gradient(180deg,#b8860b,#7a5c00)":"linear-gradient(180deg,#1a1a1a,#0d0d0d)",border:`1px solid ${canRebirth?"#ffd700":"#333"}`,color:canRebirth?"#ffd700":"#333",fontSize:8,fontFamily:PF,borderRadius:3,cursor:canRebirth?"pointer":"not-allowed",touchAction:"manipulation",boxShadow:canRebirth?"0 3px 0 #5a4000":"none"}}
                onClick={()=>canRebirth&&setModal("rebirth")}
              >
                {canRebirth?"🌟 "+t.rebirthConfirm:"🔒 "+t.rebirthLocked}
              </button>
            </div>

            {/* Prestige upgrades */}
            {PRESTIGE_UPGRADES.map(pu => {
              const owned  = prestigeBought.includes(pu.id);
              const afford = prestigePoints >= pu.cost;
              return (
                <div key={pu.id} style={{background:C.panel,border:`1px solid ${owned?"#4a1a7a":afford?"#333":"#141414"}`,borderRadius:4,padding:10,marginBottom:6,opacity:owned?0.7:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:18}}>{pu.icon}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:6,color:owned?"#ce93d8":C.text,fontFamily:PF}}>{lang==="en"?pu.nameEn:pu.nameEs} {owned?"✓":""}</div>
                      <div style={{fontSize:5,color:C.textDim,fontFamily:PF,marginTop:2}}>{lang==="en"?pu.descEn:pu.descEs}</div>
                    </div>
                    {!owned&&(
                      <button
                        style={{padding:"6px 8px",background:afford?"linear-gradient(180deg,#6a1fa2,#3a0870)":"linear-gradient(180deg,#1a1a1a,#0d0d0d)",border:`1px solid ${afford?"#ce93d8":"#2a2a2a"}`,color:afford?"#fff":"#3a3a3a",fontSize:6,fontFamily:PF,borderRadius:2,touchAction:"manipulation",boxShadow:afford?"0 2px 0 #2a0050":"none"}}
                        onClick={()=>handlePrestigeBuy(pu)}>
                        ⭐{pu.cost}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </>
        )}
      </div>

      {/* SAFE AREA BOTTOM */}
      <div style={{height:"env(safe-area-inset-bottom,0)",background:C.bg,flexShrink:0}}/>

      {/* ══ MODALS ══ */}
      {modal && modal!=="tutorial" && (
        <div style={{position:"fixed",inset:0,zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.88)"}} onClick={()=>typeof modal==="string"&&setModal(null)}/>
          <div style={{position:"relative",zIndex:1,background:"#0f1318",border:`2px solid ${C.accent}`,borderRadius:4,padding:22,maxWidth:340,width:"92%",boxShadow:`0 0 35px ${C.accent}25`,fontFamily:PF}}>

            {/* OFFLINE MODAL */}
            {typeof modal==="object"&&modal.type==="offline"&&<>
              <div style={{fontSize:11,color:C.accent,marginBottom:12,textAlign:"center"}}>{t.offline_title}</div>
              <div style={{fontSize:8,color:C.textDim,lineHeight:2,marginBottom:16,textAlign:"center"}}>
                {t.offline_desc} <span style={{color:C.accent}}>{fmtTime(modal.ms)}</span><br/><br/>
                {t.offline_earned}<br/><span style={{color:C.green,fontSize:13}}>🛢️ {fmt(modal.barrels)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"center"}}>
                <button style={{padding:"10px 28px",background:`linear-gradient(180deg,${C.accent},${C.accentDark})`,border:"2px solid #ffcc70",color:"#000",fontSize:9,fontFamily:PF,borderRadius:2,boxShadow:`0 3px 0 ${C.accentDark}`,touchAction:"manipulation"}}
                  onClick={()=>{setBarrels(b=>b+modal.barrels);setModal(null);}}>
                  {t.offline_claim}
                </button>
              </div>
            </>}

            {/* REBIRTH MODAL */}
            {modal==="rebirth"&&<>
              <div style={{fontSize:11,color:"#ffd700",marginBottom:10,textAlign:"center",textShadow:"0 0 14px #ffd700"}}>🌟 {t.rebirthTitle}</div>
              <div style={{fontSize:7,color:C.textDim,lineHeight:2,marginBottom:12,textAlign:"center"}}>{t.rebirthDesc}</div>
              {[
                [t.rebirthCount,`${rebirths} → ${rebirths+1}`,"#ffd700"],
                [t.rebirthBonus,`×${rebirthMult.toFixed(2)} → ×${Math.pow(1.2,rebirths+1).toFixed(2)}`,C.green],
                ["Prestige Points",`+${Math.max(2,Math.floor(Math.log2(Math.max(totalEarned/1e6,2))))} PP`,"#ce93d8"],
              ].map(([k,v,vc])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:7,fontSize:7}}>
                  <span style={{color:C.textDim}}>{k}:</span>
                  <span style={{color:vc}}>{v}</span>
                </div>
              ))}
              <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:10}}>
                <button style={{padding:"9px 16px",background:"linear-gradient(180deg,#1e1e1e,#0f0f0f)",border:"2px solid #333",color:C.textDim,fontSize:8,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>setModal(null)}>{t.rebirthCancel}</button>
                <button style={{padding:"9px 16px",background:"linear-gradient(180deg,#b8860b,#7a5c00)",border:"2px solid #ffd700",color:"#ffd700",fontSize:8,fontFamily:PF,borderRadius:2,boxShadow:"0 3px 0 #4a3800",touchAction:"manipulation"}} onClick={handleRebirth}>{t.rebirthConfirm}</button>
              </div>
            </>}

            {/* BOOST MODAL */}
            {modal==="boost"&&<>
              <div style={{fontSize:11,color:"#64b5f6",marginBottom:10,textAlign:"center"}}>🚀 {t.adsTitle}</div>
              <div style={{fontSize:7,color:C.textDim,lineHeight:2,marginBottom:14,textAlign:"center"}}>{t.adsDesc}</div>
              {boostActive&&<div style={{textAlign:"center",color:C.green,fontSize:10,marginBottom:12}}>{t.adsActive}: {fmtTime(boostRem)}</div>}
              <div style={{display:"flex",gap:8,justifyContent:"center"}}>
                <button style={{padding:"9px 16px",background:"linear-gradient(180deg,#1e1e1e,#0f0f0f)",border:"2px solid #333",color:C.textDim,fontSize:8,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>setModal(null)}>{t.close}</button>
                {!boostActive&&<button style={{padding:"9px 16px",background:"linear-gradient(180deg,#1565c0,#0d47a1)",border:"2px solid #64b5f6",color:"#fff",fontSize:8,fontFamily:PF,borderRadius:2,boxShadow:"0 3px 0 #002171",touchAction:"manipulation"}} onClick={handleBoostAd}>{t.adsWatch}</button>}
              </div>
            </>}

            {/* SETTINGS MODAL */}
            {modal==="settings"&&<>
              <div style={{fontSize:10,color:C.accent,marginBottom:14,textAlign:"center"}}>⚙️ {t.settings}</div>
              {[
                [t.language,
                  <div style={{display:"flex",gap:6}}>
                    {["es","en"].map(l=>(
                      <button key={l} style={{padding:"6px 12px",background:lang===l?C.accent:"#1a1a1a",border:`1px solid ${lang===l?C.accentDark:"#333"}`,color:lang===l?"#000":C.textDim,fontSize:7,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>setLang(l)}>
                        {l==="es"?"🇪🇸 ES":"🇺🇸 EN"}
                      </button>
                    ))}
                  </div>
                ],
                ["Tutorial",<button style={{padding:"6px 12px",background:"#1a1a1a",border:"1px solid #333",color:C.textDim,fontSize:7,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>{setTutStep(0);setModal("tutorial");}}>📖 Ver</button>],
                ["Save",<button style={{padding:"6px 12px",background:"#1a1a1a",border:"1px solid #333",color:C.textDim,fontSize:7,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>{saveGame();flash("💾 Saved!",C.green);setModal(null);}}>💾</button>],
                ["Reset",<button style={{padding:"6px 12px",background:"#1a0000",border:`1px solid ${C.red}`,color:C.red,fontSize:7,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>{if(confirm("¿Borrar todo el progreso?\nReset all progress?")){localStorage.removeItem("oilempire2_save");location.reload();}}}>🗑️</button>],
              ].map(([lbl,ctrl])=>(
                <div key={lbl} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:11}}>
                  <span style={{fontSize:7,color:C.textDim}}>{lbl}:</span>
                  {ctrl}
                </div>
              ))}
              <div style={{textAlign:"center",marginTop:6}}>
                <button style={{padding:"9px 24px",background:`linear-gradient(180deg,${C.accent},${C.accentDark})`,border:"2px solid #ffcc70",color:"#000",fontSize:8,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={()=>setModal(null)}>{t.close}</button>
              </div>
            </>}
          </div>
        </div>
      )}

      {/* ══ TUTORIAL ══ */}
      {modal==="tutorial"&&(
        <div style={{position:"fixed",inset:0,zIndex:200,pointerEvents:"none"}}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.91)"}}/>
          <div style={{position:"fixed",bottom:65,left:"50%",transform:"translateX(-50%)",zIndex:210,background:"#0f1318",border:`2px solid ${C.accent}`,borderRadius:4,padding:18,maxWidth:330,width:"90%",boxShadow:`0 0 35px ${C.accent}40`,pointerEvents:"auto",fontFamily:PF}}>
            <div style={{fontSize:6,color:C.textDim,marginBottom:5}}>{tutStep+1} / {tutSteps.length}</div>
            <div style={{fontSize:10,color:C.accent,marginBottom:9,textShadow:`0 0 10px ${C.accent}`,lineHeight:1.7}}>{t[tutSteps[tutStep].tk]}</div>
            <div style={{fontSize:7,color:C.textDim,lineHeight:2.1,marginBottom:16}}>{t[tutSteps[tutStep].dk]}</div>
            <div style={{display:"flex",gap:8,justifyContent:"center"}}>
              <button style={{padding:"8px 14px",background:"linear-gradient(180deg,#1e1e1e,#0f0f0f)",border:"2px solid #333",color:C.textDim,fontSize:7,fontFamily:PF,borderRadius:2,touchAction:"manipulation"}} onClick={tutSkip}>{t.tutorial_skip}</button>
              <button style={{padding:"8px 14px",background:`linear-gradient(180deg,${C.accent},${C.accentDark})`,border:"2px solid #ffcc70",color:"#000",fontSize:7,fontFamily:PF,borderRadius:2,boxShadow:`0 2px 0 ${C.accentDark}`,touchAction:"manipulation"}} onClick={tutNext}>
                {tutStep===tutSteps.length-1?t.tutorial_done:t.tutorial_next}
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OilEmpire/>);
  </script>

  <!-- Generate pixel art icon into canvas and set as apple-touch-icon -->
  <script>
    (function(){
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" shape-rendering="crispEdges"><rect width="64" height="64" fill="#0a1628"/><rect x="5" y="4" width="1" height="1" fill="#fff" opacity=".8"/><rect x="15" y="7" width="1" height="1" fill="#fff" opacity=".6"/><rect x="55" y="3" width="1" height="1" fill="#fff" opacity=".9"/><rect x="48" y="9" width="1" height="1" fill="#fff" opacity=".5"/><rect x="28" y="5" width="1" height="1" fill="#fff" opacity=".7"/><rect x="0" y="50" width="64" height="14" fill="#1a0f00"/><rect x="0" y="50" width="64" height="2" fill="#2a1800"/><rect x="22" y="52" width="20" height="4" fill="#0a1a00"/><rect x="25" y="53" width="14" height="2" fill="#0f2500"/><rect x="18" y="44" width="4" height="8" fill="#3a2800"/><rect x="42" y="44" width="4" height="8" fill="#3a2800"/><rect x="19" y="44" width="2" height="7" fill="#4a3800"/><rect x="43" y="44" width="2" height="7" fill="#4a3800"/><rect x="20" y="36" width="24" height="2" fill="#5a4200"/><rect x="21" y="36" width="22" height="1" fill="#7a5c00"/><rect x="22" y="28" width="20" height="2" fill="#5a4200"/><rect x="23" y="28" width="18" height="1" fill="#7a5c00"/><rect x="24" y="20" width="16" height="2" fill="#5a4200"/><rect x="25" y="20" width="14" height="1" fill="#7a5c00"/><rect x="19" y="20" width="3" height="26" fill="#4a3800"/><rect x="20" y="20" width="1" height="26" fill="#6a5200"/><rect x="42" y="20" width="3" height="26" fill="#4a3800"/><rect x="42" y="20" width="1" height="26" fill="#6a5200"/><rect x="22" y="12" width="20" height="2" fill="#5a4200"/><rect x="23" y="12" width="18" height="1" fill="#7a5c00"/><rect x="21" y="12" width="3" height="10" fill="#4a3800"/><rect x="40" y="12" width="3" height="10" fill="#4a3800"/><rect x="27" y="8" width="10" height="4" fill="#6a5000"/><rect x="29" y="6" width="6" height="3" fill="#7a6200"/><rect x="30" y="4" width="4" height="3" fill="#8a7200"/><rect x="31" y="2" width="2" height="3" fill="#f5a623"/><rect x="30" y="1" width="1" height="2" fill="#ff6600"/><rect x="32" y="0" width="1" height="2" fill="#ffaa00"/><rect x="31" y="0" width="2" height="1" fill="#ffdd00"/><rect x="28" y="24" width="18" height="3" fill="#f5a623"/><rect x="29" y="24" width="16" height="1" fill="#ffc040"/><rect x="29" y="22" width="6" height="6" fill="#c47d10"/><rect x="30" y="23" width="4" height="4" fill="#e09020"/><rect x="42" y="23" width="6" height="5" fill="#d4820e"/><rect x="43" y="24" width="4" height="3" fill="#e89a18"/><rect x="44" y="22" width="3" height="2" fill="#f5a623"/><rect x="44" y="28" width="2" height="14" fill="#888"/><rect x="44" y="28" width="1" height="14" fill="#aaa"/><rect x="44" y="42" width="2" height="2" fill="#1a4a00"/><rect x="44" y="44" width="1" height="2" fill="#0f3000"/><rect x="45" y="45" width="1" height="1" fill="#1a4a00"/><rect x="4" y="44" width="10" height="8" fill="#8B1a1a"/><rect x="5" y="44" width="8" height="7" fill="#a02020"/><rect x="4" y="46" width="10" height="1" fill="#c03030" opacity=".6"/><rect x="4" y="49" width="10" height="1" fill="#c03030" opacity=".6"/><rect x="8" y="44" width="2" height="8" fill="#7a1010" opacity=".4"/><rect x="50" y="44" width="10" height="8" fill="#8B1a1a"/><rect x="51" y="44" width="8" height="7" fill="#a02020"/><rect x="50" y="46" width="10" height="1" fill="#c03030" opacity=".6"/><rect x="50" y="49" width="10" height="1" fill="#c03030" opacity=".6"/><rect x="54" y="44" width="2" height="8" fill="#7a1010" opacity=".4"/><rect x="30" y="51" width="1" height="2" fill="#0f2500"/><rect x="32" y="50" width="2" height="3" fill="#0a1a00"/><rect x="35" y="51" width="1" height="2" fill="#0f2500"/><rect x="24" y="49" width="16" height="1" fill="#1a3800" opacity=".7"/></svg>`;
        const blob = new Blob([svg], {type:'image/svg+xml'});
        const url  = URL.createObjectURL(blob);
        img.onload = function(){
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, 0, 0, 512, 512);
          const dataUrl = canvas.toDataURL('image/png');
          let link = document.querySelector('link[rel="apple-touch-icon"]');
          if(!link){ link = document.createElement('link'); link.rel='apple-touch-icon'; document.head.appendChild(link); }
          link.href = dataUrl;
          URL.revokeObjectURL(url);
        };
        img.src = url;
      } catch(e){}
    })();
  </script>
