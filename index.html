<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Oil Empire"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Oil Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{-webkit-appearance:none;font-family:'Press Start 2P',monospace;cursor:pointer;touch-action:manipulation}
#app{font-family:'Press Start 2P',monospace;background:#0a0a0a;height:100dvh;max-width:440px;margin:0 auto;color:#e8e0d0;display:flex;flex-direction:column;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none}

/* Header */
#header{background:linear-gradient(180deg,#1a0a00,#08080a);border-bottom:3px solid #f5a623;padding:max(env(safe-area-inset-top,0px),8px) 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;white-space:nowrap}
#title{font-size:11px;color:#f5a623;letter-spacing:1px;text-shadow:0 0 14px #f5a62390;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin-right:8px}
#hbtns{display:flex;gap:5px;flex-shrink:0}
.hbtn{background:none;border:2px solid #1e2832;color:#8a7f70;padding:7px 9px;font-size:9px;border-radius:3px;font-weight:bold;white-space:nowrap}
#rebirth-btn.unlocked{border-color:#ffd700!important;color:#ffd700!important;animation:rglow 1.5s ease infinite}

/* Stats */
#stats{background:#0f1318;border-bottom:1px solid #1e2832;padding:6px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex-shrink:0;text-align:center}
.stat-label{font-size:7px;color:#8a7f70;display:block;margin-bottom:1px}
.stat-val{font-size:11px;color:#e8e0d0;display:block;font-weight:bold}
.stat-val.gold{color:#f5a623}
.stat-sub{font-size:6px;color:#8a7f70;display:block;margin-top:1px}
.stat-sub.green{color:#4caf50}

/* Drill area — fixed height, NOT flex:1 */
#drill-area{position:relative;height:210px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#drill-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 75%,#0d2000,transparent 55%),radial-gradient(ellipse at 75% 20%,#1a1000,transparent 55%),#090909}
#grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(245,166,35,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,.025) 1px,transparent 1px);background-size:16px 16px}
#oil-fill{position:absolute;bottom:0;left:0;right:0;height:0%;transition:height .6s ease;background:linear-gradient(0deg,#0c2200,#1a4a0070)}

/* Animated scene elements */
#scene-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.pipe-h{position:absolute;height:6px;background:linear-gradient(180deg,#5a4200,#3a2800);border-radius:3px;border:1px solid #6a5200}
.pipe-v{position:absolute;width:6px;background:linear-gradient(90deg,#5a4200,#3a2800);border-radius:3px;border:1px solid #6a5200}
.pipe-glow{box-shadow:0 0 4px #f5a62340}
.barrel-scene{position:absolute;width:18px;height:22px;border-radius:2px}
.smoke-puff{position:absolute;border-radius:50%;pointer-events:none;animation:smokeFade 2.5s ease-out forwards}
.oil-bubble{position:absolute;border-radius:50%;background:radial-gradient(circle,#2d6a00,#0a2200);border:1px solid #3a8000;animation:bubbleFloat linear infinite}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f5a623;animation:sparkFly 0.8s ease-out forwards}
.derrick-side{position:absolute;pointer-events:none}
.dollar-float{position:absolute;font-size:10px;animation:dollarRise 1.5s ease-out forwards;pointer-events:none;z-index:5}

#combo-text{position:absolute;top:16px;left:16px;font-size:12px;color:#ff6b35;text-shadow:0 0 10px #ff6b35;display:none;z-index:4;font-weight:bold}
#bps-text{position:absolute;top:16px;right:16px;font-size:8px;color:#8a7f70;z-index:4;font-weight:bold}
#rebirth-progress-bar{position:absolute;bottom:12px;left:16px;right:16px;z-index:4;display:none}
#rp-label{font-size:7px;color:#8a7f70;margin-bottom:3px;font-weight:bold}
#rebirth-ready-text{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:9px;color:#ffd700;animation:rglow 1s ease infinite;display:none;z-index:4;font-weight:bold}

#drill-btn{position:relative;z-index:3;width:165px;height:165px;border-radius:50%;border:5px solid #f5a623;background:radial-gradient(circle at 38% 32%,#3e2c00,#150f00);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:opulse 2.2s ease infinite;outline:none;flex-shrink:0}
#drill-label{font-size:6px;color:#c47d10;margin-top:4px;text-align:center;letter-spacing:.5px}
#drill-svg{transition:transform .09s,filter .09s;width:80px;height:80px}

#particles{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.particle{position:absolute;font-size:8px;color:#f5a623;font-family:'Press Start 2P',monospace;pointer-events:none;font-weight:bold;white-space:nowrap}
#flash-msg{position:absolute;top:40%;left:50%;transform:translateX(-50%) translateY(-50%);background:rgba(0,0,0,.88);border:1px solid #f5a623;padding:7px 14px;font-size:8px;color:#f5a623;border-radius:3px;pointer-events:none;z-index:50;white-space:nowrap;display:none;animation:flashIn 1.8s ease forwards}

/* Sell row */
#sell-row{padding:5px 10px;display:flex;gap:8px;flex-shrink:0}
#sell-btn{flex:1;padding:9px 5px;background:linear-gradient(180deg,#4caf50,#2e7d32);border:2px solid #81c784;color:#fff;font-size:8px;border-radius:3px;box-shadow:0 3px 0 #1b5e20;line-height:1.5;font-weight:bold}
#sell-btn:active{transform:translateY(2px);box-shadow:none}
#boost-btn{padding:9px 10px;background:linear-gradient(180deg,#0d47a1,#060d2e);border:2px solid #1565c0;color:#fff;font-size:7px;border-radius:3px;text-align:center;line-height:1.7;box-shadow:0 3px 0 #001040;min-width:72px;font-weight:bold}
#boost-btn.active{background:linear-gradient(180deg,#4a148c,#1a0050);border-color:#ce93d8;box-shadow:0 3px 0 #12003d}

/* Tabs */
#tab-bar{display:flex;border-bottom:2px solid #1e2832;background:#0f1318;flex-shrink:0}
.tab-btn{flex:1;padding:8px 4px;background:none;border:none;border-bottom:2px solid transparent;color:#8a7f70;font-size:8px;font-weight:bold}
.tab-btn.active{background:#1e2832;border-bottom-color:#f5a623;color:#f5a623}

/* Tab content — fills all remaining space, flex column */
#tab-content{flex:1;overflow-y:auto;padding:6px 8px 6px;-webkit-overflow-scrolling:touch;min-height:0;display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

/* Upgrade cards — stretch to fill, no fixed height */
#upg-list{flex:1;display:flex;flex-direction:column;gap:0;min-height:0}
.upg-card{background:#0f1318;border:1px solid #141414;border-radius:4px;padding:0 10px;margin-bottom:4px;display:flex;align-items:center;gap:10px;transition:border-color .2s;flex:1;min-height:0}
.upg-card:last-child{margin-bottom:0}
.upg-card.afford{border-color:#2a2a2a}
.upg-card.maxed{border-color:#1a3a00}
.upg-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.upg-info{flex:1;min-width:0}
.upg-row{display:flex;justify-content:space-between;margin-bottom:3px}
.upg-name{font-size:7px;color:#e8e0d0;font-weight:bold}
.upg-name.maxed{color:#4caf50}
.upg-lvl{font-size:7px;color:#8a7f70}
.upg-lvl.maxed{color:#4caf50}
.prog-bar-bg{background:#0a0a0a;border-radius:2px;height:7px;overflow:hidden;border:1px solid #222}
.prog-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.upg-stat{font-size:5px;color:#8a7f70;margin-top:2px}
.upg-buy-btn{padding:7px 6px;min-width:56px;border:1px solid #222;background:linear-gradient(180deg,#1e1e1e,#0f0f0f);color:#3a3a3a;font-size:6px;border-radius:2px;flex-shrink:0;text-align:center;line-height:1.8;font-weight:bold}
.upg-buy-btn.afford{background:linear-gradient(180deg,#f5a623,#c47d10);border-color:#c47d10;color:#000;box-shadow:0 2px 0 #c47d10}
.upg-buy-btn.maxed{background:linear-gradient(180deg,#1a3a00,#0f2000);border-color:#2a5a00;color:#4caf50}

/* Prestige */
#pp-card{background:#100820;border:1px solid #4a1a7a;border-radius:4px;padding:11px;margin-bottom:9px;text-align:center}
#pp-label{font-size:8px;color:#ce93d8;margin-bottom:4px;font-weight:bold}
#pp-val{font-size:20px;color:#e040fb;font-weight:bold}
#pp-sub{font-size:7px;color:#8a7f70;margin-top:3px}
.rebirth-req-card{background:#0f0c00;border:2px solid #2a2000;border-radius:4px;padding:11px;margin-bottom:9px}
.rebirth-req-card.can-rebirth{background:#1a1200;border-color:#ffd700;animation:rglow 1.5s ease infinite}
.rr-title{font-size:9px;color:#6a5a00;margin-bottom:7px;text-align:center;font-weight:bold}
.rr-title.can{color:#ffd700}
.rr-desc{font-size:7px;color:#8a7f70;line-height:2;margin-bottom:9px;text-align:center}
.rr-req-row{font-size:7px;margin-bottom:4px;font-weight:bold}
.rr-req-label{color:#888}
.rr-req-label.done{color:#4caf50}
.req-prog{background:#0a0a0a;border-radius:2px;height:8px;overflow:hidden;border:1px solid #222;margin-bottom:7px}
.req-prog-fill{height:100%;border-radius:2px;transition:width .4s}
.rebirth-action-btn{width:100%;padding:11px;margin-top:9px;background:linear-gradient(180deg,#1a1a1a,#0d0d0d);border:1px solid #333;color:#333;font-size:8px;border-radius:3px;font-weight:bold}
.rebirth-action-btn.can{background:linear-gradient(180deg,#b8860b,#7a5c00);border-color:#ffd700;color:#ffd700;box-shadow:0 3px 0 #5a4000}
.prest-card{background:#0f1318;border:1px solid #141414;border-radius:4px;padding:11px;margin-bottom:8px}
.prest-card.owned{border-color:#4a1a7a;opacity:.72}
.prest-inner{display:flex;align-items:center;gap:10px}
.prest-icon{font-size:18px}
.prest-name{font-size:7px;margin-bottom:3px;font-weight:bold}
.prest-desc{font-size:6px;color:#8a7f70}
.prest-buy-btn{padding:7px 8px;background:linear-gradient(180deg,#1a1a1a,#0d0d0d);border:1px solid #2a2a2a;color:#3a3a3a;font-size:7px;border-radius:2px;flex-shrink:0;font-weight:bold}
.prest-buy-btn.afford{background:linear-gradient(180deg,#6a1fa2,#3a0870);border-color:#ce93d8;color:#fff;box-shadow:0 2px 0 #2a0050}

/* Modal */
#modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
#modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.88)}
#modal-box{position:relative;z-index:1;background:#0f1318;border:2px solid #f5a623;border-radius:4px;padding:20px;max-width:340px;width:92%;box-shadow:0 0 35px #f5a62325}
.modal-title{font-size:11px;color:#f5a623;margin-bottom:12px;text-align:center}
.modal-title.gold{color:#ffd700;text-shadow:0 0 14px #ffd700}
.modal-title.blue{color:#64b5f6}
.modal-desc{font-size:7px;color:#8a7f70;line-height:2;margin-bottom:14px;text-align:center}
.modal-row{display:flex;justify-content:space-between;margin-bottom:7px;font-size:7px}
.modal-row-label{color:#8a7f70}
.btn-row{display:flex;gap:8px;justify-content:center}
.btn-primary{padding:9px 18px;background:linear-gradient(180deg,#f5a623,#c47d10);border:2px solid #ffcc70;color:#000;font-size:8px;border-radius:2px;box-shadow:0 3px 0 #c47d10}
.btn-gold{padding:9px 18px;background:linear-gradient(180deg,#b8860b,#7a5c00);border:2px solid #ffd700;color:#ffd700;font-size:8px;border-radius:2px;box-shadow:0 3px 0 #5a4000}
.btn-blue{padding:9px 18px;background:linear-gradient(180deg,#1565c0,#0d47a1);border:2px solid #64b5f6;color:#fff;font-size:8px;border-radius:2px;box-shadow:0 3px 0 #002171}
.btn-sec{padding:9px 16px;background:linear-gradient(180deg,#1e1e1e,#0f0f0f);border:2px solid #333;color:#8a7f70;font-size:8px;border-radius:2px}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.settings-label{font-size:7px;color:#8a7f70}
.lang-btn{padding:6px 12px;background:#1a1a1a;border:1px solid #333;color:#8a7f70;font-size:7px;border-radius:2px}
.lang-btn.active{background:#f5a623;border-color:#c47d10;color:#000}
.small-btn{padding:6px 12px;background:#1a1a1a;border:1px solid #333;color:#8a7f70;font-size:7px;border-radius:2px}
.danger-btn{padding:6px 12px;background:#1a0000;border:1px solid #e53935;color:#e53935;font-size:7px;border-radius:2px}
.offline-barrel{color:#4caf50;font-size:14px}

/* Tutorial */
#tutorial-overlay{position:fixed;inset:0;z-index:200;display:none;pointer-events:none}
#tutorial-overlay.show{display:block}
#tut-bg{position:absolute;inset:0;background:rgba(0,0,0,.91)}
#tut-box{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:210;background:#0f1318;border:2px solid #f5a623;border-radius:4px;padding:16px;max-width:330px;width:90%;box-shadow:0 0 35px #f5a62340;pointer-events:auto}
#tut-step{font-size:6px;color:#8a7f70;margin-bottom:4px}
#tut-title{font-size:10px;color:#f5a623;margin-bottom:8px;text-shadow:0 0 10px #f5a623;line-height:1.7}
#tut-desc{font-size:7px;color:#8a7f70;line-height:2.1;margin-bottom:14px}
#safe-bottom{height:env(safe-area-inset-bottom,0);background:#0a0a0a;flex-shrink:0}

/* Keyframes */
@keyframes opulse{0%,100%{box-shadow:0 0 20px rgba(245,166,35,.4),inset 0 0 20px rgba(0,0,0,.5)}50%{box-shadow:0 0 40px rgba(245,166,35,.8),0 0 70px rgba(245,166,35,.25),inset 0 0 20px rgba(0,0,0,.5)}}
@keyframes rglow{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.5)}50%{box-shadow:0 0 22px rgba(255,215,0,1),0 0 45px rgba(255,215,0,.4)}}
@keyframes flashIn{0%{opacity:0;transform:translateX(-50%) translateY(-60%)}20%{opacity:1;transform:translateX(-50%) translateY(-50%)}80%{opacity:1;transform:translateX(-50%) translateY(-50%)}100%{opacity:0;transform:translateX(-50%) translateY(-40%)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.5)}}
@keyframes smokeFade{0%{opacity:.7;transform:scale(1) translateY(0)}100%{opacity:0;transform:scale(2.5) translateY(-30px)}}
@keyframes bubbleFloat{0%{transform:translateY(0) scale(1);opacity:.8}50%{opacity:1}100%{transform:translateY(-40px) scale(1.2);opacity:0}}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}
@keyframes dollarRise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes pipeFlow{0%{box-shadow:inset 0 0 0 0 #f5a62320}50%{box-shadow:inset 0 0 8px 2px #f5a62340}100%{box-shadow:inset 0 0 0 0 #f5a62320}}
@keyframes derrickBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes flameFlicker{0%,100%{transform:scaleY(1) scaleX(1);opacity:1}33%{transform:scaleY(1.3) scaleX(.8);opacity:.8}66%{transform:scaleY(.8) scaleX(1.2);opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="title">IMPERIO PETROLERO</div>
    <div id="hbtns">
      <button class="hbtn" id="boost-hbtn" onclick="openModal('boost')">🚀</button>
      <button class="hbtn" id="rebirth-btn" onclick="openModal('rebirth')">🌟</button>
      <button class="hbtn" onclick="openModal('settings')">⚙️</button>
    </div>
  </div>

  <div id="stats">
    <div>
      <span class="stat-label">🛢️ <span id="lbl-barrels">Barriles</span></span>
      <span class="stat-val" id="stat-barrels">0</span>
      <span class="stat-sub green" id="stat-bps"></span>
    </div>
    <div>
      <span class="stat-label">⚗️ <span id="lbl-proc">Procesados</span></span>
      <span class="stat-val" id="stat-proc">0</span>
      <span class="stat-sub" id="lbl-price">$102/barril</span>
    </div>
    <div>
      <span class="stat-label">💵 <span id="lbl-dollars">Dólares</span></span>
      <span class="stat-val gold" id="stat-dollars">$0</span>
      <span class="stat-sub" id="stat-total">$0 total</span>
    </div>
  </div>

  <div id="drill-area">
    <div id="drill-bg"></div>
    <div id="grid-overlay"></div>
    <div id="oil-fill"></div>
    <div id="scene-layer"></div>
    <div id="combo-text">¡COMBO! ×<span id="combo-num">0</span></div>
    <div id="bps-text"></div>
    <div id="rebirth-progress-bar">
      <div id="rp-label"></div>
      <div class="prog-bar-bg"><div id="rp-fill" class="prog-bar-fill" style="background:#ffd700;width:0%"></div></div>
    </div>
    <div id="rebirth-ready-text">⚡ RENACER AHORA ⚡</div>
    <button id="drill-btn" ontouchstart="handleTap(event)" onmousedown="handleTap(event)">
      <svg id="drill-svg" width="72" height="72" viewBox="0 0 18 18" style="image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(245,166,35,.5))">
        <rect x="0" y="15" width="18" height="3" fill="#2a1800"/>
        <rect x="1" y="15" width="16" height="2" fill="#3a2400"/>
        <rect x="2"  y="6" width="2" height="10" fill="#4a3200"/><rect x="2"  y="6" width="1" height="10" fill="#5a4200"/>
        <rect x="14" y="6" width="2" height="10" fill="#4a3200"/><rect x="15" y="6" width="1" height="10" fill="#5a4200"/>
        <rect x="2" y="12" width="14" height="1" fill="#5a4200"/>
        <rect x="3" y="9"  width="12" height="1" fill="#5a4200"/>
        <rect x="4" y="3"  width="10" height="1" fill="#6a5200"/>
        <rect x="7" y="1"  width="4"  height="3" fill="#7a6200"/>
        <rect x="8" y="0"  width="2"  height="2" fill="#f5a623"/>
        <rect x="8" y="0"  width="1"  height="1" fill="#ff4400" opacity=".9"/>
        <rect x="9" y="0"  width="1"  height="1" fill="#ffaa00" opacity=".9"/>
        <g id="pump-anim">
          <rect x="3" y="4" width="12" height="2" fill="#f5a623"/>
          <rect x="4" y="4" width="10" height="1" fill="#ffc84a"/>
          <rect x="7" y="3" width="4"  height="4" fill="#c47d10"/>
          <rect x="8" y="4" width="2"  height="2" fill="#e09020"/>
          <rect x="13" y="4" width="4" height="3" fill="#d4820e"/>
          <rect x="13" y="4" width="3" height="2" fill="#e89218"/>
          <rect x="14" y="6" width="2" height="9" fill="#777"/>
          <rect x="14" y="6" width="1" height="9" fill="#999"/>
        </g>
      </svg>
      <div id="drill-label">¡TOCA PARA TALADRAR!</div>
    </button>
    <div id="particles"></div>
    <div id="flash-msg"></div>
  </div>

  <div id="sell-row">
    <button id="sell-btn" onclick="handleSell()">
      💰 VENDER TODO<br><span id="sell-sub" style="font-size:6px;opacity:.8"></span>
    </button>
    <button id="boost-btn" onclick="openModal('boost')">🚀 IMPULSO ×3</button>
  </div>

  <div id="tab-bar">
    <button class="tab-btn active" id="tab-upg" onclick="setTab('upgrades')">⬆️ MEJORAS</button>
    <button class="tab-btn" id="tab-pres" onclick="setTab('prestige')">🌟 PRESTIGIO</button>
  </div>

  <div id="tab-content"></div>
  <div id="safe-bottom"></div>
</div>

<div id="modal-overlay" onclick="closeModalIfBackdrop(event)">
  <div id="modal-backdrop"></div>
  <div id="modal-box"></div>
</div>

<div id="tutorial-overlay">
  <div id="tut-bg"></div>
  <div id="tut-box">
    <div id="tut-step"></div>
    <div id="tut-title"></div>
    <div id="tut-desc"></div>
    <div class="btn-row">
      <button class="btn-sec" onclick="tutSkip()" id="tut-skip-btn">OMITIR</button>
      <button class="btn-primary" onclick="tutNext()" id="tut-next-btn">SIGUIENTE</button>
    </div>
  </div>

// AUDIO ENGINE — Web Audio API, no files needed

let AC = null;
function getAC(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function playTone(freq,type,dur,vol,attack,decay){
  try{
    const ac=getAC(); if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,ac.currentTime);
    const v=vol||0.15;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(v,ac.currentTime+(attack||0.01));
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(dur||0.2));
    o.start(ac.currentTime); o.stop(ac.currentTime+(dur||0.2)+(decay||0));
  }catch(e){}
}
function playNoise(dur,vol){
  try{
    const ac=getAC(); if(!ac) return;
    const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    const s=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=200;
    s.buffer=buf; s.connect(f); f.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(vol||0.08,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    s.start(ac.currentTime);
  }catch(e){}
}

    b.className="oil-bubble";
    const sz=3+Math.random()*7;
    b.style.cssText=`width:${sz}px;height:${sz}px;position:absolute;left:${5+Math.random()*85}%;bottom:0;animation:bubbleFloat ${1.5+Math.random()*2.5}s ease-out forwards;opacity:${0.5+Math.random()*0.4}`;
    layer.appendChild(b);
    setTimeout(()=>b.remove(),4000);
  }, lv>=3?600:1200);

  // Smoke from chimneys at higher levels
  if(lv>=4){
    smokeTimer=setInterval(()=>{
      const layer=document.getElementById("scene-layer");
      if(!layer) return;
      const area=document.getElementById("drill-area");
      const W=area?area.offsetWidth:380, H=area?area.offsetHeight:220;
      [W*0.07, W*0.87].forEach(sx=>{
        const s=document.createElement("div");
        s.className="smoke-puff";
        const sz=8+Math.random()*12;
        s.style.cssText=`width:${sz}px;height:${sz}px;position:absolute;left:${sx}px;top:${H*0.12}px;background:rgba(120,100,70,${0.3+Math.random()*0.3});animation-duration:${2+Math.random()}s`;
        layer.appendChild(s);
        setTimeout(()=>s.remove(),3500);
      });
    },1800);
  }
}

// Sparks on tap
function spawnSparks(x,y){
  const layer=document.getElementById("particles");
  for(let i=0;i<6;i++){
    const sp=document.createElement("div");
    sp.className="spark";
    const angle=Math.random()*Math.PI*2;
    const dist=20+Math.random()*40;
    sp.style.cssText=`left:${x}px;top:${y+50}px;--sx:${Math.cos(angle)*dist}px;--sy:${Math.sin(angle)*dist}px`;
    layer.appendChild(sp);
    setTimeout(()=>sp.remove(),800);
  }
}

// Dollar float on sell
function spawnDollarFloat(){
  const area=document.getElementById("drill-area");
  const W=area?area.offsetWidth:380, H=area?area.offsetHeight:220;
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="dollar-float";
    d.textContent="💵";
    d.style.cssText=`left:${20+Math.random()*60}%;top:${30+Math.random()*40}%;animation-delay:${i*150}ms`;
    area.appendChild(d);
    setTimeout(()=>d.remove(),1700);
  }
}

// ══════════════════════════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════════════════════════
function spawnParticles(x,y,power){
  const container=document.getElementById("particles");
  for(let i=0;i<5;i++){
    const p=document.createElement("div"); p.className="particle";
    p.style.left=(x+(Math.random()-.5)*50)+"px";
    p.style.top=(y+45+(Math.random()-.5)*30)+"px";
    p.textContent=Math.random()>.6?"+"+Math.ceil(power):(Math.random()>.5?"🛢️":"💧");
    p.style.animation="floatUp 1.3s ease forwards";
    container.appendChild(p);
    setTimeout(()=>p.remove(),1300);
  }
}

// ══════════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════════
function handleTap(e){
  e.preventDefault();
  sfxDrill();
  const power=tapPower();
  G.barrels+=power; G.processed+=power*0.8;
  oilLevel=Math.min(100,oilLevel+power*0.15);
  comboCount++;
  if(comboTimer) clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{ comboCount=0; updateCombo(); },1500);
  updateCombo();
  if(comboCount>5) sfxCombo();

  const btn=document.getElementById("drill-btn");
  const svg=document.getElementById("drill-svg");
  btn.style.animation="none"; btn.style.transform="scale(0.91)";
  svg.style.transform="translateY(3px) scale(.96)";
  svg.style.filter="drop-shadow(0 0 12px rgba(245,166,35,.9))";
  setTimeout(()=>{ btn.style.transform=""; svg.style.transform=""; svg.style.filter="drop-shadow(0 0 8px rgba(245,166,35,.5))"; btn.style.animation="opulse 2.2s ease infinite"; },130);

  const rect=btn.getBoundingClientRect();
  const cx=(e.touches?.[0]?.clientX??e.clientX)-rect.left;
  const cy=(e.touches?.[0]?.clientY??e.clientY)-rect.top;
  spawnParticles(cx,cy,power);
  if(getSceneLevel()>=4) spawnSparks(cx,cy);
  updateStats();
}

function handleSell(){
  if(G.processed<1) return;
  sfxSell();
  const price=sellPrice();
  const earned=Math.floor(G.processed)*price*G.rebirthMult;
  G.dollars+=earned; G.totalEarned+=earned;
  G.processed=0; oilLevel=0;
  flash("+$"+fmt(earned));
  spawnDollarFloat();
  checkMilestones(); updateStats(); renderTab();
  const btn=document.getElementById("sell-btn");
  btn.style.transform="translateY(2px)"; btn.style.boxShadow="none";
  setTimeout(()=>{ btn.style.transform=""; btn.style.boxShadow=""; },400);
}

function handleBuy(id){
  const u=UPGRADES.find(x=>x.id===id); if(!u) return;
  const cost=upgradeCost(u);
  if(G.dollars<cost){ sfxError(); flash(t().notEnough,"#e53935"); return; }
  sfxBuy();
  G.dollars-=cost; G.upgrades[u.id]=(G.upgrades[u.id]||0)+1;
  flash("⬆️ "+(G.lang==="en"?u.en:u.es));
  // Rebuild scene if level changed
  const newLv=getSceneLevel();
  if(newLv!==sceneLevel){ sceneLevel=newLv; buildScene(); }
  updateStats(); renderTab(); updateRebirthUI();
}

function handleRebirth(){
  if(!canRebirth()){ sfxError(); flash(G.lang==="es"?"¡Requisitos no cumplidos!":"Requirements not met!","#e53935"); return; }
  sfxRebirth();
  const nc=G.rebirths+1;
  const pp=Math.max(2,Math.floor(Math.log2(Math.max(G.totalEarned/1e6,2))));
  G.rebirths=nc; G.rebirthMult=Math.pow(1.2,nc); G.pp=(G.pp||0)+pp;
  G.barrels=0; G.processed=0; G.dollars=0; G.totalEarned=0; oilLevel=0;
  G.seenMilestones=[];
  UPGRADES.forEach(u=>{ G.upgrades[u.id]=0; });
  closeModal(); flash("🌟 REBIRTH! ×"+G.rebirthMult.toFixed(2),"#ffd700");
  sceneLevel=0; buildScene();
  updateStats(); renderTab(); updateRebirthUI();
}

function handlePrestigeBuy(id){
  const pu=PRESTIGE_UPGRADES.find(x=>x.id===id);
  if(!pu||G.prestigeBought.includes(id)) return;
  if((G.pp||0)<pu.cost){ sfxError(); flash(t().notEnough,"#e53935"); return; }
  sfxPrestige();
  G.pp-=pu.cost; G.prestigeBought.push(id);
  flash("🌟 "+(G.lang==="en"?pu.en:pu.es),"#ce93d8");
  updateStats(); renderTab();
}

function handleBoost(){
  sfxBoost();
  const dur=G.prestigeBought.includes("megaboost")?20*60*1000:10*60*1000;
  G.boostActive=true; G.boostEnd=Date.now()+dur;
  G.barrels*=3; closeModal();
  flash("🚀 BOOST ×3!","#64b5f6"); updateStats();
}

function checkMilestones(){
  MILESTONES.forEach(m=>{
    if(!G.seenMilestones.includes(m.money)&&G.totalEarned>=m.money){
      G.seenMilestones.push(m.money);
      sfxMilestone();
      flash("🏆 "+(G.lang==="en"?m.en:m.es),"#ffd700");
    }
  });
}

// ══════════════════════════════════════════════════════════════
// GAME LOOP
// ══════════════════════════════════════════════════════════════
function gameLoop(){
  const now=Date.now(), dt=Math.min((now-lastTime)/1000,0.5); lastTime=now;
  const bps=totalBPS();
  if(bps>0){ const g=bps*dt; G.barrels+=g; G.processed+=g*0.8; oilLevel=Math.min(100,oilLevel+g*0.02); }
  if(G.boostActive&&now>G.boostEnd){ G.boostActive=false; updateBoostBtn(); }
  updateStats(); updateOilFill(); updateRebirthUI(); checkMilestones();
  requestAnimationFrame(gameLoop);
}

// ══════════════════════════════════════════════════════════════
// UI UPDATES
// ══════════════════════════════════════════════════════════════
function updateStats(){
  const bps=totalBPS();
  document.getElementById("stat-barrels").textContent=fmt(G.barrels);
  document.getElementById("stat-proc").textContent=fmt(G.processed);
  document.getElementById("stat-dollars").textContent="$"+fmt(G.dollars);
  document.getElementById("stat-total").textContent="$"+fmt(G.totalEarned)+" total";
  if(bps>0){ document.getElementById("stat-bps").textContent="+"+fmt(bps)+t().perSec; document.getElementById("bps-text").textContent="⚡"+fmt(bps)+t().perSec; }
  else { document.getElementById("stat-bps").textContent=""; document.getElementById("bps-text").textContent=""; }
  const price=sellPrice();
  document.getElementById("sell-sub").textContent=fmt(G.processed)+" × $"+Math.floor(price);
  updateBoostBtn();
}
function updateBoostBtn(){
  const btn=document.getElementById("boost-btn"), hbtn=document.getElementById("boost-hbtn");
  if(G.boostActive&&Date.now()<G.boostEnd){
    const rem=fmtTime(G.boostEnd-Date.now());
    btn.innerHTML="🚀 ACTIVO<br>"+rem; btn.className="active";
    hbtn.textContent="🚀"+rem; hbtn.style.color="#64b5f6"; hbtn.style.borderColor="#1565c0";
  } else {
    btn.innerHTML="🚀 "+t().adsTitle; btn.className="";
    hbtn.textContent="🚀"; hbtn.style.color=""; hbtn.style.borderColor="";
  }
}
function updateCombo(){
  const el=document.getElementById("combo-text");
  if(comboCount>3){ el.style.display="block"; document.getElementById("combo-num").textContent=comboCount; }
  else el.style.display="none";
}
function updateOilFill(){ document.getElementById("oil-fill").style.height=oilLevel+"%"; }
function updateRebirthUI(){
  const btn=document.getElementById("rebirth-btn");
  const ready=canRebirth();
  if(ready) btn.classList.add("unlocked"); else btn.classList.remove("unlocked");
  const pct=rebirthMoneyPct();
  const rpBar=document.getElementById("rebirth-progress-bar");
  const rpReady=document.getElementById("rebirth-ready-text");
  if(ready){ rpBar.style.display="none"; rpReady.style.display="block"; }
  else if(pct>0.1){ rpBar.style.display="block"; rpReady.style.display="none"; document.getElementById("rp-label").textContent="🌟 $"+fmt(G.dollars)+" / $500M"; document.getElementById("rp-fill").style.width=(pct*100)+"%"; }
  else { rpBar.style.display="none"; rpReady.style.display="none"; }
}
function updateLang(){
  const tt=t();
  document.getElementById("title").textContent=tt.title;
  document.getElementById("drill-label").textContent=tt.tap;
  document.getElementById("lbl-barrels").textContent=tt.barrels;
  document.getElementById("lbl-proc").textContent=tt.proc;
  document.getElementById("lbl-dollars").textContent=tt.dollars;
  document.getElementById("lbl-price").textContent=tt.sellPrice;
  document.getElementById("sell-btn").childNodes[0].textContent="💰 "+tt.sell;
  document.getElementById("tab-upg").textContent="⬆️ "+tt.upgrades;
  document.getElementById("tab-pres").textContent="🌟 "+tt.prestige;
  renderTab();
}

// ══════════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════════
function setTab(name){
  currentTab=name;
  document.getElementById("tab-upg").className="tab-btn"+(name==="upgrades"?" active":"");
  document.getElementById("tab-pres").className="tab-btn"+(name==="prestige"?" active":"");
  renderTab();
}
function renderTab(){
  const c=document.getElementById("tab-content");
  if(currentTab==="upgrades") renderUpgrades(c); else renderPrestige(c);
}
function renderUpgrades(c){
  let inner="";
  UPGRADES.forEach(u=>{
    const level=G.upgrades[u.id]||0, cost=upgradeCost(u);
    const afford=G.dollars>=cost, maxed=level>=u.max;
    const name=G.lang==="en"?u.en:u.es;
    const pct=(level/u.max*100).toFixed(1);
    const barCol=maxed?"#4caf50":"#f5a623";
    const cardCls="upg-card"+(maxed?" maxed":afford?" afford":"");
    const btnCls="upg-buy-btn"+(maxed?" maxed":afford?" afford":"");
    const btnTxt=maxed?("✓ "+t().maxed):(t().buy+"<br>$"+fmt(cost));
    const statTxt=(u.bps>0?"+"+u.bps+"bps ":"")+(u.tap>0?"+"+u.tap+" tap":"");
    inner+=`<div class="${cardCls}"><div class="upg-icon">${u.icon}</div><div class="upg-info"><div class="upg-row"><span class="upg-name${maxed?" maxed":""}">${name}</span><span class="upg-lvl${maxed?" maxed":""}">${level}/${u.max}</span></div><div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%;background:${barCol}"></div></div><div class="upg-stat">${statTxt}</div></div><button class="${btnCls}" onclick="${maxed?"":("handleBuy('"+u.id+"')")}">${btnTxt}</button></div>`;
  });
  c.innerHTML=`<div id="upg-list">${inner}</div>`;
}
function renderPrestige(c){
  const tt=t();
  const itemsPct=(rebirthItemsPct()*100).toFixed(1), moneyPct=(rebirthMoneyPct()*100).toFixed(1);
  const ready=canRebirth();
  const itemsDone=UPGRADES.filter(u=>(G.upgrades[u.id]||0)>=u.max).length;
  const itemsColor=allMaxed()?"#4caf50":"#888", moneyColor=G.dollars>=REBIRTH_MONEY?"#4caf50":"#ffd700";
  const cardCls="rebirth-req-card"+(ready?" can-rebirth":"");
  const btnCls="rebirth-action-btn"+(ready?" can":"");
  const btnTxt=ready?("🌟 "+tt.rebirthConfirm):tt.rebirthLocked;
  const btnClick=ready?"openModal('rebirth')":`sfxError();flash('${tt.rebirthLocked.replace("🔒 ","")}','#e53935')`;
  let html=`<div id="pp-card"><div id="pp-label">Prestige Points</div><div id="pp-val">⭐ ${G.pp||0}</div><div id="pp-sub">Rebirths: ${G.rebirths} · Mult: ×${G.rebirthMult.toFixed(2)}</div></div>
  <div class="${cardCls}"><div class="rr-title${ready?" can":""}">🌟 ${tt.rebirthTitle}</div><div class="rr-desc">${tt.rebirthDesc}</div>
  <div class="rr-req-row"><span class="rr-req-label${allMaxed()?" done":""}">${allMaxed()?"✓":"("+itemsDone+"/"+UPGRADES.length+")"} ${tt.rebirthReqItems}</span></div>
  <div class="req-prog"><div class="req-prog-fill" style="width:${itemsPct}%;background:${itemsColor}"></div></div>
  <div class="rr-req-row" style="margin-top:4px"><span class="rr-req-label${G.dollars>=REBIRTH_MONEY?" done":""}">${G.dollars>=REBIRTH_MONEY?"✓":"$"+fmt(G.dollars)+" / $500M"} ${tt.rebirthReqMoney}</span></div>
  <div class="req-prog"><div class="req-prog-fill" style="width:${moneyPct}%;background:${moneyColor}"></div></div>
  <button class="${btnCls}" onclick="${btnClick}">${btnTxt}</button></div>`;
  PRESTIGE_UPGRADES.forEach(pu=>{
    const owned=G.prestigeBought.includes(pu.id), afford=(G.pp||0)>=pu.cost;
    const name=G.lang==="en"?pu.en:pu.es, desc=G.lang==="en"?pu.en_d:pu.es_d;
    html+=`<div class="prest-card${owned?" owned":""}"><div class="prest-inner"><span class="prest-icon">${pu.icon}</span><div style="flex:1"><div class="prest-name" style="color:${owned?"#ce93d8":"#e8e0d0"}">${name} ${owned?"✓":""}</div><div class="prest-desc">${desc}</div></div>${!owned?`<button class="prest-buy-btn${afford?" afford":""}" onclick="handlePrestigeBuy('${pu.id}')">⭐${pu.cost}</button>`:""}</div></div>`;
  });
  c.innerHTML=html;
}

// ══════════════════════════════════════════════════════════════
// MODALS
// ══════════════════════════════════════════════════════════════
function openModal(type){
  currentModal=type;
  const box=document.getElementById("modal-box"), tt=t();
  if(type==="rebirth"){
    const nextMult=Math.pow(1.2,G.rebirths+1);
    const ppGain=Math.max(2,Math.floor(Math.log2(Math.max(G.totalEarned/1e6,2))));
    box.innerHTML=`<div class="modal-title gold">🌟 ${tt.rebirthTitle}</div><div class="modal-desc">${tt.rebirthDesc}</div><div class="modal-row"><span class="modal-row-label">${tt.rebirthCount}:</span><span style="color:#ffd700">${G.rebirths} → ${G.rebirths+1}</span></div><div class="modal-row"><span class="modal-row-label">${tt.rebirthBonus}:</span><span style="color:#4caf50">×${G.rebirthMult.toFixed(2)} → ×${nextMult.toFixed(2)}</span></div><div class="modal-row"><span class="modal-row-label">Prestige Points:</span><span style="color:#ce93d8">+${ppGain} PP</span></div><div class="btn-row" style="margin-top:12px"><button class="btn-sec" onclick="closeModal()">${tt.rebirthCancel}</button><button class="btn-gold" onclick="handleRebirth()">${tt.rebirthConfirm}</button></div>`;
  } else if(type==="boost"){
    const active=G.boostActive&&Date.now()<G.boostEnd;
    box.innerHTML=`<div class="modal-title blue">🚀 ${tt.adsTitle}</div><div class="modal-desc">${tt.adsDesc}</div>${active?`<div style="text-align:center;color:#4caf50;font-size:10px;margin-bottom:12px">${tt.adsActive}: ${fmtTime(G.boostEnd-Date.now())}</div>`:""}<div class="btn-row"><button class="btn-sec" onclick="closeModal()">${tt.close}</button>${!active?`<button class="btn-blue" onclick="handleBoost()">${tt.adsWatch}</button>`:""}</div>`;
  } else if(type==="settings"){
    box.innerHTML=`<div class="modal-title">⚙️ ${tt.settings}</div><div class="settings-row"><span class="settings-label">${tt.language}:</span><div style="display:flex;gap:6px"><button class="lang-btn${G.lang==="es"?" active":""}" onclick="setLang('es')">🇪🇸 ES</button><button class="lang-btn${G.lang==="en"?" active":""}" onclick="setLang('en')">🇺🇸 EN</button></div></div><div class="settings-row"><span class="settings-label">${tt.tutorial}:</span><button class="small-btn" onclick="openTutorial()">📖</button></div><div class="settings-row"><span class="settings-label">${tt.save}:</span><button class="small-btn" onclick="saveGame();flash('💾 Saved!','#4caf50');closeModal()">💾</button></div><div class="settings-row"><span class="settings-label">${tt.reset}:</span><button class="danger-btn" onclick="confirmReset()">🗑️</button></div><div style="text-align:center;margin-top:8px"><button class="btn-primary" onclick="closeModal()">${tt.close}</button></div>`;
  }
  document.getElementById("modal-overlay").classList.add("show");
}
function openOfflineModal(ms,barrels){
  const tt=t(); currentModal="offline";
  document.getElementById("modal-box").innerHTML=`<div class="modal-title">${tt.offline_title}</div><div class="modal-desc">${tt.offline_away} <span style="color:#f5a623">${fmtTime(ms)}</span><br><br>${tt.offline_earned}<br><span class="offline-barrel">🛢️ ${fmt(barrels)}</span></div><div class="btn-row"><button class="btn-primary" onclick="claimOffline(${barrels})">${tt.offline_claim}</button></div>`;
  document.getElementById("modal-overlay").classList.add("show");
  if(!G.tutDone) setTimeout(showTutorial,500);
}
function claimOffline(barrels){ G.barrels+=barrels; closeModal(); updateStats(); }
function closeModal(){ document.getElementById("modal-overlay").classList.remove("show"); currentModal=null; }
function closeModalIfBackdrop(e){ if(e.target===document.getElementById("modal-overlay")||e.target===document.getElementById("modal-backdrop")) closeModal(); }
function confirmReset(){ if(confirm("¿Borrar todo el progreso?\nReset all progress?")){ localStorage.removeItem(SAVE_KEY); location.reload(); } }
function setLang(l){ G.lang=l; closeModal(); updateLang(); updateStats(); }

// ══════════════════════════════════════════════════════════════
// TUTORIAL
// ══════════════════════════════════════════════════════════════
function showTutorial(){ tutStep=0; renderTutStep(); document.getElementById("tutorial-overlay").classList.add("show"); }
function openTutorial(){ closeModal(); showTutorial(); }
function renderTutStep(){
  const steps=t().tuts, s=steps[tutStep];
  document.getElementById("tut-step").textContent=(tutStep+1)+" / "+steps.length;
  document.getElementById("tut-title").textContent=s.t;
  document.getElementById("tut-desc").textContent=s.d;
  const tt=t();
  document.getElementById("tut-next-btn").textContent=tutStep===steps.length-1?tt.tutorial_done:tt.tutorial_next;
  document.getElementById("tut-skip-btn").textContent=tt.tutorial_skip;
}
function tutNext(){ const steps=t().tuts; if(tutStep<steps.length-1){ tutStep++; renderTutStep(); } else tutSkip(); }
function tutSkip(){ G.tutDone=true; document.getElementById("tutorial-overlay").classList.remove("show"); }

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
loadGame();
updateLang();
updateStats();
renderTab();
sceneLevel=getSceneLevel();
buildScene();
setInterval(saveGame,10000);
gameLoop();
</script>
</body>
</html>
